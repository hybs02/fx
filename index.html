<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>FX シグナル</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#141b2a; --line:#2a3550;
    --buy:#23c483; --sell:#ff5d6c; --neu:#8896b3;
    --text:#e8edf7; --sub:#9aa7c2; --accent:#ffcf4a;
    --buyBg:rgba(35,196,131,.14); --sellBg:rgba(255,93,108,.14); --accBg:rgba(255,207,74,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0 auto; background:var(--bg); color:var(--text); max-width:520px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;}
  button,input,select{font:inherit; color:inherit;}
  .top{display:flex; align-items:center; gap:8px; margin:2px 0 10px;}
  .top h1{font-size:18px; margin:0; flex:1;}
  .top .upd{font-size:11px; color:var(--sub); text-align:right; line-height:1.3;}
  .iconbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; min-width:40px; height:36px; padding:0 10px; font-size:13px; font-weight:700;}
  .spin{display:inline-block; animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:14px; margin:0 0 8px; color:var(--accent); display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card h2 small{font-size:11px; color:var(--sub); font-weight:600;}
  .hero{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--line); background:var(--card);}
  .hero .k{font-size:12px; color:var(--sub);}
  .hero .big{font-size:22px; font-weight:800; margin:2px 0 4px; line-height:1.35;}
  .hero.go-buy{background:var(--buyBg); border-color:var(--buy);}
  .hero.go-sell{background:var(--sellBg); border-color:var(--sell);}
  .hero .go-row{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border-radius:12px; background:rgba(0,0,0,.25); cursor:pointer;}
  .hero .go-row b{font-size:17px;}
  .hero .go-row .arrow{margin-left:auto; color:var(--sub); font-size:18px;}
  .note{font-size:12px; color:var(--sub); line-height:1.65;}
  .note b{color:var(--text);}
  .banner{background:var(--accBg); border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px;}
  .warn{background:var(--sellBg); border:1px solid var(--sell); color:#ffb3ba; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px; font-weight:600;}
  .prow{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; min-height:52px;}
  .prow:last-child{border-bottom:none;}
  .prow:active{background:var(--card2);}
  .pn{flex:0 0 78px; font-weight:800; font-size:14px; line-height:1.2;}
  .pn small{display:block; font-size:10.5px; color:var(--sub); font-weight:600;}
  .gauge{flex:1; min-width:0;}
  .gbar{position:relative; height:8px; border-radius:4px; background:#0c111c; overflow:hidden;}
  .gbar .zb{position:absolute; left:0; top:0; bottom:0; width:25%; background:rgba(35,196,131,.35);}
  .gbar .zs{position:absolute; right:0; top:0; bottom:0; width:25%; background:rgba(255,93,108,.35);}
  .gbar .dot{position:absolute; top:-3px; width:4px; height:14px; margin-left:-2px; border-radius:2px; background:var(--text);}
  .gnum{font-size:11px; color:var(--sub); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip{flex:0 0 auto; font-size:11.5px; font-weight:800; padding:4px 8px; border-radius:8px; white-space:nowrap; background:rgba(136,150,179,.16); color:var(--sub);}
  .chip.buy{background:rgba(35,196,131,.22); color:var(--buy);}
  .chip.sell{background:rgba(255,93,108,.22); color:var(--sell);}
  .chip.acc{background:var(--accBg); color:var(--accent);}
  .back{background:none; border:none; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0; margin-bottom:4px;}
  .dec{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--neu); background:rgba(136,150,179,.1);}
  .dec.buy{border-color:var(--buy); background:var(--buyBg);}
  .dec.sell{border-color:var(--sell); background:var(--sellBg);}
  .dec .pair{font-size:13px; color:var(--sub);}
  .dec .pair b{color:var(--text); font-size:17px;}
  .dec .head{font-size:23px; font-weight:800; margin:4px 0 2px;}
  .dec.buy .head{color:var(--buy);} .dec.sell .head{color:var(--sell);} .dec .head.neu{color:var(--text);}
  .chk{margin-top:10px; background:rgba(0,0,0,.25); border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.7;}
  .chk .ok{color:#8ff0c6;} .chk .ng{color:#ffb3ba; font-weight:700;} .chk .wa{color:var(--accent);}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--sub);}
  .kv b{text-align:right;}
  .steps{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px;}
  .steps h3{font-size:13px; margin:2px 0 6px; color:var(--accent);}
  .steps h4{font-size:12px; color:var(--sub); margin:10px 0 3px; padding-top:8px; border-top:1px dashed var(--line);}
  .st{font-size:12.5px; line-height:1.75; margin:2px 0;}
  .kbd{display:inline-block; padding:0 6px; border:1px solid #3a4763; border-radius:6px; background:#1d2638; font-weight:700; line-height:1.5; white-space:nowrap;}
  .val{font-weight:800; color:var(--accent);}
  .slbox{margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--sellBg); color:#ffb3ba; font-size:12.5px; font-weight:600;}
  .field{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .field label{flex:0 0 118px; font-size:12.5px; color:var(--sub);}
  .field input,.field select{flex:1; min-width:0; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0c111c; color:var(--text); font-size:16px; font-weight:700;}
  .btn{display:block; width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#1a1300; font-weight:800; font-size:15px; margin-top:10px;}
  .btn.ghost{background:transparent; color:var(--accent);}
  .btn.red{background:transparent; color:#ffb3ba; border-color:var(--sell);}
  .btn:active{opacity:.8;}
  .pos{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:var(--card2);}
  .pos.due{border-color:var(--accent); background:var(--accBg);}
  .pos .t{display:flex; justify-content:space-between; gap:8px; font-weight:800;}
  .plus{color:var(--buy);} .minus{color:var(--sell);}
  canvas{width:100%; display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:6px 4px; border-bottom:1px solid var(--line); text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--sub); font-weight:600; font-size:11.5px;}
  details.card > summary{cursor:pointer; color:var(--accent); font-weight:700; list-style:none; display:flex; justify-content:space-between;}
  details.card > summary::after{content:"＋"; color:var(--sub);}
  details.card[open] > summary::after{content:"－";}
  details.card > summary::-webkit-details-marker{display:none;}
  details.card[open] > summary{margin-bottom:8px;}
  .foot{font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}
  .loading{text-align:center; padding:40px 0; color:var(--sub);}
  #toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0;
    max-width:min(92vw, 480px); background:#26324a; color:var(--text); border:1px solid var(--accent); border-radius:12px;
    padding:10px 14px; font-size:13px; font-weight:700; line-height:1.5; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.45);
    transition:opacity .2s, transform .2s; pointer-events:none; z-index:10;}
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  dl{margin:0; line-height:1.55;}
  dt{color:var(--accent); font-weight:700; margin-top:10px; font-size:13px;}
  dd{margin:2px 0 0; font-size:12.5px;}
  .tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px;}
  .tabs button{padding:10px 0; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:13px; font-weight:700;}
  .tabs button.on{background:var(--accent); color:#1a1300; border-color:var(--accent);}
  .ybar{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:3px 0;}
  .ybar .y{flex:0 0 36px; color:var(--sub);}
  .ybar .b{flex:1; position:relative; height:12px;}
  .ybar .b i{position:absolute; top:0; bottom:0; border-radius:3px;}
  .ybar .v{flex:0 0 52px; text-align:right;}
</style>
</head>
<body>
  <div class="top">
    <h1>FX シグナル</h1>
    <div class="upd" id="upd"></div>
    <button class="iconbtn" id="refresh" aria-label="更新">↻</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="home" class="on">いま</button>
    <button data-v="stats">成績</button>
    <button data-v="set">設定・用語</button>
  </div>
  <div id="app"><div class="loading">読み込み中…</div></div>
  <div class="foot">1時間ごとに自動で判定し直しています（GitHub が計算・APIキー不要）<br>※参考情報です。必ず勝てる方法はありません。最終判断は自己責任で。</div>

<script>
"use strict";
// ================= 基本 =================
const PAIRS = ["USDJPY","EURJPY","GBPJPY","AUDJPY","NZDJPY","CADJPY","CHFJPY","EURUSD","GBPUSD","AUDUSD","EURGBP"];
const JP = {USD:"米ドル",JPY:"円",EUR:"ユーロ",GBP:"ポンド",AUD:"豪ドル",NZD:"NZドル",CAD:"カナダドル",CHF:"スイスフラン"};
const MINI = {USDJPY:"USM/JPY",EURJPY:"EUM/JPY",GBPJPY:"GBM/JPY",AUDJPY:"AUM/JPY"};   // DMM のミニ（1Lot＝1,000通貨）
// データは毎時の自動計算が専用の枝（data）に上書きする。リポジトリの履歴を膨らませないため
const DATA_URLS = ["https://raw.githubusercontent.com/hybs02/fx/data/data.json", "data.json"];
const $ = s => document.querySelector(s);
const app = () => $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = store.get("fx_cache2", null), FUND = store.get("fx_fund", null);
let balance = +store.get("fx_bal", 0) || 0;
let riskPct = +store.get("fx_risk", 2) || 2;
let positions = store.get("fx_pos", []).map(x => x.t ? x : {...x, t: Date.parse(x.date + "T00:00:00Z") / 1000, exitT: Date.parse(x.exit + "T00:00:00Z") / 1000});
let view = "home", sel = null, loading = false, lastFetch = 0;

const slash = p => p.slice(0,3) + "/" + p.slice(3);
const jpName = p => JP[p.slice(0,3)] + "/" + JP[p.slice(3)];
const pipOf = p => p.endsWith("JPY") ? 0.01 : 0.0001;
const dpOf = p => p.endsWith("JPY") ? 3 : 5;
const fx = (p, v) => v == null ? "—" : (+v).toFixed(dpOf(p));
const yen = v => (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString();
const sgn = v => (v > 0 ? "+" : "") + v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W = ["日","月","火","水","木","金","土"];
const nowS = () => Date.now() / 1000;
// 時刻（UNIX 秒）→ 日本時間の表示
function tj(t, withDay = true){
  const d = new Date(t * 1000 + 9 * 3600e3);
  const hm = `${d.getUTCHours()}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
  return withDay ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${W[d.getUTCDay()]}) ${hm}` : hm;
}
function jd(iso){ const [y,m,d] = iso.split("-").map(Number); return `${m}/${d}(${W[new Date(Date.UTC(y,m-1,d)).getUTCDay()]})`; }
const isoJ = t => new Date(t * 1000 + 9 * 3600e3).toISOString().slice(0, 10);
const isoAdd = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400e3).toISOString().slice(0, 10);
function hrs(sec){ const m = Math.max(0, Math.round(sec / 60)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}` : `${m}分`; }
// 為替が動いているか（土曜の朝〜月曜の朝は休み）
function marketOpen(){
  const d = new Date(Date.now() + 9 * 3600e3), w = d.getUTCDay(), h = d.getUTCHours();
  return !((w === 6 && h >= 7) || w === 0 || (w === 1 && h < 7));
}

// 1Lot（1万通貨）で 1pip 動いた時の円
function yenPerPip(p){
  const q = p.slice(3), P = DATA && DATA.pairs;
  if(q === "JPY") return 100;
  if(q === "USD" && P && P.USDJPY) return P.USDJPY.price;
  if(q === "GBP" && P && P.GBPJPY) return P.GBPJPY.price;
  return 150;
}
// 資金とリスク%から Lot 数（ミニがあるペアはミニも見る）
function lotPlan(p, slPips){
  const perLot = slPips * yenPerPip(p);
  if(!(balance > 0)) return {set:false, perLot};
  const cap = balance * riskPct / 100;
  const lots = Math.floor(cap / perLot);
  if(lots >= 1) return {set:true, lots, mini:false, units:lots * 10000, loss:lots * perLot, cap, perLot};
  if(MINI[p]){
    const ml = Math.floor(cap / (perLot / 10));
    if(ml >= 1) return {set:true, lots:ml, mini:true, units:ml * 1000, loss:ml * perLot / 10, cap, perLot};
  }
  return {set:true, lots:0, cap, perLot};
}

// ================= データ =================
// 12 秒で打ち切る fetch（通信が止まっても「読み込み中」のまま固まらないように）
async function getJson(url, opts = {}){
  const c = new AbortController(), timer = setTimeout(() => c.abort(), 12000);
  try{
    const r = await fetch(url, {cache:"no-store", signal:c.signal, ...opts});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }catch(e){ throw e.name === "AbortError" ? new Error("通信が12秒で終わらなかった") : e; }
  finally{ clearTimeout(timer); }
}
// ↻ を押した時だけ GitHub API から直接読む（raw は 5 分キャッシュされ、押しても古い値が返ることがあるため）
const API_URL = "https://api.github.com/repos/hybs02/fx/contents/data.json?ref=data";
function toast(msg){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.innerHTML = msg; el.className = "show";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.className = "", 4000);
}
async function load(manual = false){
  if(loading){ if(manual) toast("いま読み込み中です…"); return; }
  loading = true; $("#refresh").innerHTML = '<span class="spin">↻</span>';
  const started = Date.now(), before = DATA && DATA.updatedTs;
  try{
    const t = Date.now();
    const srcs = (manual ? [[API_URL, {headers:{Accept:"application/vnd.github.raw+json"}}]] : [])
      .concat(DATA_URLS.map(u => [u + "?t=" + t, {}]));
    let d = null, lastErr = null;
    for(const [u, o] of srcs){
      try{ d = await getJson(u, o); if(d && d.pairs) break; d = null; }catch(e){ lastErr = e; }
    }
    if(!d) throw lastErr || new Error("取得できません");
    const f = await getJson("fundamentals.json?t=" + t).catch(() => null);
    DATA = d; if(f) FUND = f; lastFetch = Date.now();
    store.set("fx_cache2", DATA); if(f) store.set("fx_fund", FUND);
    const wait = 500 - (Date.now() - started); if(wait > 0) await new Promise(r => setTimeout(r, wait));   // 押したことが分かるように
    render();
    if(manual) toast(before && d.updatedTs <= before
      ? `いまの表示が最新です（${tj(d.updatedTs)} の計算）<br><span style="font-weight:400">自動の計算は20分ごと。混んでいると遅れます</span>`
      : `新しい計算を取り込みました（${tj(d.updatedTs)}）`);
  }catch(e){
    if(!DATA) app().innerHTML = `<div class="warn">データを読み込めませんでした（${esc(e.message)}）。通信を確認して ↻ を押してください。</div>`;
    else $("#upd").innerHTML = '<span style="color:var(--sell)">通信できず前回の値</span>';
    if(manual) toast(`読み込めませんでした（${esc(e.message)}）`);
  }finally{ loading = false; $("#refresh").textContent = "↻"; }
}
// 開いている間は 10 分ごとに最新を取りに行く／しばらく裏にいた後で戻ったら取りに行く
setInterval(() => { if(document.visibilityState === "visible") load(); }, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && Date.now() - lastFetch > 5 * 60e3) load(); });
// 右上の「何分前」を1分ごとに書き直す
setInterval(() => { if(DATA) $("#upd").innerHTML = `${tj(DATA.updatedTs, false)} の計算<br>${hrs(nowS() - DATA.updatedTs)}前`; }, 60e3);

// ================= 判定（画面で決めるのは「経過時間」と「あなたの事情」だけ） =================
// サイン（RSI・損切り幅・手仕舞いの目安）は build.py が1時間ごとに計算済み。ここでは
//   ・サインから何時間たったか（3時間以内が目安・6時間を過ぎたら見送り）
//   ・介入警戒（ドル円の買い）・資金・同じペアを保有中か・発表
// を突き合わせて「入る／見送り／様子見」を1つに決める。
function eventsFor(p, fromIso, days){
  if(!FUND) return [];
  const a = p.slice(0,3), b = p.slice(3), to = isoAdd(fromIso, days);
  return (FUND.events || []).filter(e => (e.cur === a || e.cur === b) && e.date >= fromIso && e.date <= to);
}
function alertFor(p, price){
  const al = FUND && FUND.pairAlerts && FUND.pairAlerts[p];
  if(!al || price == null) return null;
  if(al.dangerDir === "up" && price >= al.level - al.near) return al;
  if(al.dangerDir === "down" && price <= al.level + al.near) return al;
  return null;
}
function decide(p){
  const pd = DATA.pairs[p], r = DATA.rule, S = pd.sig;
  if(!S) return {kind:"WAIT", rows:[]};
  const rows = [], ng = [], wa = [];
  const add = (s, t) => { rows.push({s, t}); if(s === "ng") ng.push(t); if(s === "wa") wa.push(t); };
  const dir = S.dir, dn = dir === 1 ? "買い" : "売り";
  const mine = positions.find(x => x.pair === p);
  if(mine && mine.t >= S.t - 3600)
    return {kind:"DONE", dir, dn, rows:[{s:"ok", t:`記録済み：${tj(mine.t)} に ${fx(p, mine.entry)} で入った。手仕舞いは ${tj(mine.exitT)} ごろ`}], ng:[], wa:[]};
  const age = nowS() - S.t, left = r.limit * 3600 - age;
  if(left <= 0) add("ng", `時間：サインから${r.limit}時間を過ぎた（遅く入るほど成績が下がる。次のサインを待つ）`);
  else if(age > r.best * 3600) add("wa", `時間：サインから${hrs(age)}。${r.best}時間以内が目安（あと${hrs(left)}で締め切り）`);
  else add("ok", `サイン：${tj(S.t)} に RSI ${S.from}→${S.to} で${dir === 1 ? r.buyAt + "以下" : r.sellAt + "以上"}に入った（${hrs(age)}前）`);
  const al = alertFor(p, pd.price);
  if(al && dir === 1) add("ng", "介入警戒：ドル円は介入が入りやすい水準。『買い』は入らない");
  if(mine) add("ng", "保有中：このペアはもう持っている（1ペア1つまで）");
  const lp = lotPlan(p, S.atrPips * r.slAtr);
  if(!lp.set) add("wa", "資金：未設定（設定タブで資金を入れると Lot 数と損失額が出る）");
  else if(lp.lots < 1) add("ng", `資金：最小の1Lotでも損切り時の損が${yen(lp.perLot / (MINI[p] ? 10 : 1))}で、上限${yen(lp.cap)}（資金の${riskPct}%）を超える`);
  else add("ok", `資金：${lp.mini ? "ミニ " : ""}${lp.lots}Lot なら損切り時の損は${yen(lp.loss)}（資金の${(lp.loss / balance * 100).toFixed(1)}%）`);
  const ev = eventsFor(p, isoJ(nowS()), 1);
  if(ev.length) add("wa", `発表：${ev.map(e => `${jd(e.date)} ${e.time} ${e.name}`).join("、")}。値が飛びやすい（損切りは必ず置く）`);
  return {kind: ng.length ? "NO" : "GO", dir, dn, rows, ng, wa, lp};
}

function render(){
  if(!DATA) return;
  $("#upd").innerHTML = `${tj(DATA.updatedTs, false)} の計算<br>${hrs(nowS() - DATA.updatedTs)}前`;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === (view === "pair" ? "home" : view)));
  if(view === "pair" && sel) return renderPair(sel);
  if(view === "stats") return renderStats();
  if(view === "set") return renderSettings();
  renderHome();
}
function statusOf(p){
  const pd = DATA.pairs[p], r = DATA.rule, S = pd.sig;
  if(S){
    const left = r.limit * 3600 - (nowS() - S.t);
    if(left > 0) return {cls: S.dir === 1 ? "buy" : "sell", t: `${S.dir === 1 ? "買い" : "売り"} あと${hrs(left)}`, rank:0};
  }
  const act = (pd.active || []).find(a => !a.done && !a.stopped);
  if(act) return {cls:"acc", t:`${act.dir === 1 ? "買い" : "売り"}の保有期間`, rank:3};
  if(pd.rsi <= r.buyAt + 5 && pd.rsi > r.buyAt) return {cls:"acc", t:"買いまで あと少し", rank:1};
  if(pd.rsi >= r.sellAt - 5 && pd.rsi < r.sellAt) return {cls:"acc", t:"売りまで あと少し", rank:1};
  return {cls:"", t:"", rank:4};
}
function nearTrig(p){
  const pd = DATA.pairs[p], t = pd.trig;
  const pb = t.buy ? (1 - t.buy / pd.price) * 100 : 1e9, ps = t.sell ? (t.sell / pd.price - 1) * 100 : 1e9;
  if(pb === 1e9 && ps === 1e9) return "";
  return pb <= ps ? `${fx(p, t.buy)}以下で買い` : `${fx(p, t.sell)}以上で売り`;
}
function staleNote(){
  const age = nowS() - DATA.updatedTs;
  if(marketOpen() && age > 3 * 3600) return `<div class="warn">⚠ 最後の更新から${hrs(age)}たっています（GitHub の自動実行が遅れている可能性）。数値は ${tj(DATA.updatedTs)} 時点です。</div>`;
  return "";
}

    ${near.length ? `<br>サインが近いペア：${near.map(x => `<b>${slash(x.p)}</b>（${x.s.t.replace(" あと少し", "")}）`).join("、")}` : ""}</div></div>`;

function positionsHtml(){

      <div class="note" style="color:${due ? "var(--accent)" : "var(--sub)"}"><b style="color:inherit">${due ? "手仕舞いの時刻です" : "手仕舞い " + tj(x.exitT) + " ごろ"}</b>

function eventStrip(){

  return `<details class="card" ${soon ? "open" : ""}><summary>📅 この1週間の重要発表（${ev.length}件）</summary>

function renderHome(){
  const r = DATA.rule;
  const list = PAIRS.map(p => ({p, s:statusOf(p)})).sort((a, b) => a.s.rank - b.s.rank || Math.abs(50 - DATA.pairs[b.p].rsi) - Math.abs(50 - DATA.pairs[a.p].rsi));
  const rows = list.map(({p, s}) => {
    const pd = DATA.pairs[p];

  app().innerHTML = staleNote() + heroHtml() + positionsHtml() + eventStrip() +
    `<div class="card"><h2>11ペアの状態 <small>${tj(DATA.latestT)} までの値</small></h2>${rows}
     <div class="note" style="margin-top:8px;">RSI（行きすぎ度 0〜100）が<b>${r.buyAt}以下に入ったら買い</b>、<b>${r.sellAt}以上に入ったら売り</b>。越えた最初の時刻だけがサインです（1時間ごとに判定）。右の値は「次の1時間でこの値を越えるとサイン」。</div></div>`;
  app().querySelectorAll("[data-p]").forEach(el => el.addEventListener("click", () => { sel = el.dataset.p; view = "pair"; render(); window.scrollTo(0, 0); }));

  }));
  app().querySelectorAll("[data-ics]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); downloadIcs(positions[+el.dataset.ics]); }));
}

function renderPair(p){
  const pd = DATA.pairs[p], r = DATA.rule, d = decide(p), S = pd.sig;

  const sub = d.kind === "GO" ? `サインから${r.best}時間以内が目安` + (d.wa.length ? "・△を読んでから" : "")
            : d.kind === "DONE" ? "あとは損切り（逆指値）を置いて、手仕舞いの時刻を待つだけ"
            : d.kind === "NO" ? "理由：" + d.ng.map(t => t.split("：")[0]).join("・")
            : `いまの RSI ${pd.rsi}。${r.buyAt}以下か${r.sellAt}以上に入った時がサイン`;
  const mark = {ok:"✔", ng:"✖", wa:"△"};

  const al = alertFor(p, pd.price);
  let html = `<button class="back" id="back">‹ 一覧へ</button>
    <div class="dec ${cls}"><div class="pair"><b>${slash(p)}</b>　${jpName(p)}　いま <b>${fx(p, pd.live ? pd.live.p : pd.price)}</b></div>
      <div class="head ${cls ? "" : "neu"}">${head}</div><div class="note">${sub}</div>${chk}</div>`;
  if(al) html += `<div class="warn">⚠ ${esc(al.note)}</div>`;

  html += triggerCard(p) + activeCard(p);
  if(d.kind !== "GO") html += `<details class="card"><summary>${d.kind === "DONE" ? "注文手順（損切り・手仕舞いの確認）" : d.kind === "NO" ? "参考：それでも入るなら（注文手順）" : "参考：注文のしかた（サインが出た時用）"}</summary>${orderCard(p, dir, false)}</details>`;
  html += `<div class="card"><h2>チャート <small>毎日${tj(pd.t, false)}の値・90日</small></h2><canvas id="cv" height="260"></canvas>
    <div class="note">上：値段　下：RSI（緑の帯＝${r.buyAt}以下、赤の帯＝${r.sellAt}以上）。▲▼＝過去のサイン</div></div>`;
  html += pairStatsCard(p) + refCard(p) + fundCard(p);
  app().innerHTML = html;
  $("#back").onclick = () => { view = "home"; render(); };
  bindOrder(p); drawChart(p);
}

function bindOrder(p){
  const pd = DATA.pairs[p], r = DATA.rule;
  ["o1", "o2"].forEach(id => {
    const box = document.getElementById(id); if(!box) return;
    const dir = +box.dataset.dir, atr = +box.dataset.atr, inp = box.querySelector(".fill");
    const upd = () => { const f = parseFloat(String(inp.value).replace(/[^\d.]/g, ""));
      box.querySelectorAll(".slv").forEach(x => x.textContent = f > 0 ? fx(p, f - dir * r.slAtr * atr) : "—"); };
    inp.addEventListener("input", upd); upd();
    const rec = box.querySelector(".rec");
    if(rec) rec.addEventListener("click", () => {
      const f = parseFloat(String(inp.value).replace(/[^\d.]/g, ""));
      if(!(f > 0)){ alert("約定したレートを入れてください"); return; }
      const S = pd.sig, lp = lotPlan(p, S.atrPips * r.slAtr), lots = lp.set && lp.lots >= 1 ? lp.lots : 1;
      const t = Math.round(nowS());
      positions = positions.filter(x => x.pair !== p);
      positions.push({pair:p, dir, entry:f, stop:+(f - dir * r.slAtr * atr).toFixed(dpOf(p)), lots, mini:!!lp.mini,
        units: lp.mini ? lots * 1000 : lots * 10000, t, exitT: t + 7 * 86400});
      store.set("fx_pos", positions);
      view = "home"; render(); window.scrollTo(0, 0);
    });
  });
}

    ${st ? `<div class="note">${ymJ(all.from)}から ${st.n}回・勝率${st.wr}%・1回平均${sgn(st.exp)}%・PF${st.pf ?? "—"}</div>` : ""}
    <div class="note">※1ペアだけだと回数が少なく偶然で上下します。判断には<b>11ペア合算の成績</b>（${all.n}回・PF${all.pf}）を使います。</div>
    ${last ? `<table style="margin-top:6px;"><tr><th>入った時刻</th><th>向き</th><th>終わり方</th><th>損益</th></tr>${last}</table>` : ""}</details>`;
}
function ymJ(t){ const d = new Date(t * 1000 + 9 * 3600e3); return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月`; }
function refCard(p){
  const pd = DATA.pairs[p], f = pd.ref;
  const tf = (x, nm) => x ? `<div class="kv"><span>${nm}の RSI</span><b>${x.rsi}（${x.up ? "短期は上向き" : "短期は下向き"}）</b></div>` : "";
  return `<details class="card"><summary>参考：ほかの指標・短い時間足</summary>
    <div class="note" style="margin-bottom:4px;">判定には使っていません（足しても成績が良くならなかった）。相場の雰囲気を見る用です。</div>
    <div class="kv"><span>ボリンジャーバンド内の位置</span><b>${f.bb ?? "—"}%（0＝下端・100＝上端）</b></div>
    <div class="kv"><span>移動平均 5日 と 25日</span><b>${f.ma === 1 ? "5日が上（上昇寄り）" : "5日が下（下降寄り）"}</b></div>
    <div class="kv"><span>MACD</span><b>${f.macd === 1 ? "上向き" : "下向き"}</b></div>
    <div class="kv"><span>25日平均との差</span><b>${sgn(f.dev25)}%</b></div>
    ${tf(f.h8, "8時間足")}${tf(f.h4, "4時間足")}
    <div class="kv"><span>1日の平均的な値幅（ATR）</span><b>${pd.atrPips}pips</b></div></details>`;
}
function fundCard(p){
  if(!FUND) return "";
  const a = p.slice(0,3), b = p.slice(3), c = FUND.currencies || {};
  const ev = eventsFor(p, isoJ(nowS()), 30);
  return `<details class="card"><summary>いまの相場の状況（ファンダ）</summary>
    <div class="note" style="color:var(--text)">${esc(FUND.summary)}</div>

    ${ev.length ? `<div class="note" style="margin-top:8px; color:var(--accent)">このペアに関わる発表（30日以内）</div>` + ev.map(e => `<div class="kv"><span>${jd(e.date)} ${e.time}</span><b>${esc(e.name)}</b></div>`).join("") : ""}
    <div class="note" style="margin-top:8px;">※相場の空気であって、判定には足していません（ドル円の介入警戒だけは買いを止めます）。${FUND.updated} 時点。</div></details>`;
}

// ---------- チャート ----------
function drawChart(p){
  const cv = $("#cv"); if(!cv) return;
  const pd = DATA.pairs[p], r = DATA.rule, ch = pd.chart;
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth, Ht = 260;
  cv.width = Wd * dpr; cv.height = Ht * dpr; cv.style.height = Ht + "px";
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const N = ch.c.length, L = 6, R = 52, T1 = 8, B1 = 150, T2 = 168, B2 = 250;
  const x = i => L + (Wd - L - R) * i / (N - 1);
  const lo = Math.min(...ch.c), hi = Math.max(...ch.c), pad = (hi - lo) * 0.08 || 0.01;
  const y1 = v => T1 + (B1 - T1) * (1 - (v - lo + pad) / (hi - lo + 2 * pad));
  const y2 = v => T2 + (B2 - T2) * (1 - v / 100);
  g.font = "11px sans-serif"; g.fillStyle = "#9aa7c2";
  g.strokeStyle = "#2a3550"; g.lineWidth = 1;
  [lo, (lo + hi) / 2, hi].forEach(v => { g.beginPath(); g.moveTo(L, y1(v)); g.lineTo(Wd - R, y1(v)); g.stroke(); g.fillText(fx(p, v), Wd - R + 4, y1(v) + 4); });
  g.strokeStyle = "#5b8cff"; g.lineWidth = 2; g.beginPath();
  ch.c.forEach((v, i) => i ? g.lineTo(x(i), y1(v)) : g.moveTo(x(i), y1(v))); g.stroke();
  g.fillStyle = "rgba(35,196,131,.18)"; g.fillRect(L, y2(r.buyAt), Wd - L - R, y2(0) - y2(r.buyAt));
  g.fillStyle = "rgba(255,93,108,.18)"; g.fillRect(L, y2(100), Wd - L - R, y2(r.sellAt) - y2(100));
  g.fillStyle = "#9aa7c2"; [r.buyAt, 50, r.sellAt].forEach(v => g.fillText(String(v), Wd - R + 4, y2(v) + 4));
  g.strokeStyle = "#ffcf4a"; g.lineWidth = 2; g.beginPath();
  ch.r.forEach((v, i) => i ? g.lineTo(x(i), y2(v)) : g.moveTo(x(i), y2(v))); g.stroke();
  // 過去のサイン（1時間ごとの判定で出た時刻を、いちばん近い日の位置に置く）
  (ch.ev || []).forEach(e => {
    let i = ch.t.findIndex(t => t >= e.t); if(i < 0) i = N - 1;
    const s = e.dir, yy = y1(ch.c[i]) + (s === 1 ? 12 : -12);
    g.fillStyle = s === 1 ? "#23c483" : "#ff5d6c"; g.beginPath();
    g.moveTo(x(i), yy - 6 * s); g.lineTo(x(i) - 6, yy + 5 * s); g.lineTo(x(i) + 6, yy + 5 * s); g.fill();
  });
  g.fillStyle = "#9aa7c2"; g.textAlign = "left"; g.fillText(tj(ch.t[0]).split(" ")[0], L, Ht - 2);
  g.textAlign = "right"; g.fillText(tj(ch.t[N - 1]).split(" ")[0], Wd - R, Ht - 2);
}

// ---------- 成績 ----------
function renderStats(){
  const S = DATA.stats, r = DATA.rule, a = S.roll, Lg = S.long;
  const months = (DATA.updatedTs - a.from) / (30.4 * 86400);
  const maxAbs = Math.max(...Lg.years.map(y => Math.abs(y.sum)), 1);
  const years = Lg.years.map(y => { const w = Math.abs(y.sum) / maxAbs * 50;
    return `<div class="ybar"><span class="y">${y.y}</span><span class="b"><i style="${y.sum >= 0 ? `left:50%;width:${w}%;background:var(--buy)` : `right:50%;width:${w}%;background:var(--sell)`}"></i></span>
      <span class="v ${y.sum >= 0 ? "plus" : "minus"}">${sgn(y.sum)}%</span></div>`; }).join("");
  const eras = Lg.eras.map(e => `<tr><td>${e.name}</td><td>${e.n}</td><td>${e.wr}%</td><td>${sgn(e.exp)}%</td><td>${e.pf}</td></tr>`).join("");
  const rec = DATA.recent.map(t => `<tr><td>${tj(t.t).split(" ")[0]}</td><td>${slash(t.p)}</td><td>${t.dir === 1 ? "買い" : "売り"}</td>
    <td class="${t.ret >= 0 ? "plus" : "minus"}">${sgn(t.ret.toFixed(2))}%</td></tr>`).join("");
  app().innerHTML = `
    <div class="card"><h2>いまの規則の成績 <small>${ymJ(a.from)}〜・11ペア合算・スプレッド込み</small></h2>
      <div class="kv"><span>回数</span><b>${a.n}回（月に約${(a.n / months).toFixed(1)}回）</b></div>
      <div class="kv"><span>勝率</span><b>${a.wr}%</b></div>
      <div class="kv"><span>1回の平均損益</span><b class="plus">${sgn(a.exp)}%</b></div>
      <div class="kv"><span>勝った時の平均／負けた時の平均</span><b>${sgn(a.avgWin)}% ／ ${a.avgLoss}%</b></div>
      <div class="kv"><span>PF（総利益÷総損失）</span><b>${a.pf}</b></div>
      <div class="kv"><span>損切りに届いた割合</span><b>${a.sl}%</b></div>
      <div class="kv"><span>買い／売り</span><b>PF ${a.buy.pf} ／ ${a.sell.pf}</b></div>
      <div class="note" style="margin-top:8px;">1時間ごとに判定する形の成績です。1時間足は約2年分しか取れないため、ここまでしか確かめられません（長い期間は下）。
        %は入った値に対する損益。資金に対する損益はリスク%で決まります（リスク2%なら損切り1回で資金の−2%）。</div></div>
    <div class="card"><h2>入るのが遅れたら <small>同じ期間</small></h2>
      <table><tr><th>サインから</th>${S.delay.map(x => `<th>${x.h}時間</th>`).join("")}</tr>
        <tr><td>PF</td>${S.delay.map(x => `<td>${x.pf}</td>`).join("")}</tr></table>
      <div class="note" style="margin-top:6px;">早いほど良い。${r.best}時間以内が目安、${r.limit}時間を過ぎたら見送ります。</div></div>
    <div class="card"><h2>長い期間の検証 <small>日足・${Lg.from}年〜</small></h2>
      <div class="note">1時間足は古い分が無いので、日足で「毎日決まった時刻に判定する」形を22年分測りました。</div>
      <table style="margin-top:6px;"><tr><th>判定する時刻</th><th>通算PF</th><th>04-10</th><th>11-14</th><th>15-18</th><th>19-26</th></tr>
        ${S.cuts.map(c => `<tr><td>${esc(c.name)}</td><td>${c.pf}</td>${c.eras.map(v => `<td class="${v >= 1 ? "" : "minus"}">${v}</td>`).join("")}</tr>`).join("")}</table>
      <div class="note" style="margin-top:6px;">どの時刻でも通算は勝ち越し＝時刻に縛られた規則ではありません（終値だけで計算した近似）。朝9時が一番安定していました。</div>
      <div class="note" style="margin-top:8px; color:var(--accent)">朝9時の日足で高値・安値まで使った詳しい成績（${Lg.n}回・勝率${Lg.wr}%・PF${Lg.pf}）</div>
      <table><tr><th>期間</th><th>回数</th><th>勝率</th><th>平均</th><th>PF</th></tr>${eras}</table>
      <div style="margin-top:8px;">${years}</div>
      <div class="note" style="margin-top:6px;">負けた年 ${Lg.years.filter(y => y.sum < 0).length}/${Lg.years.length}。1年単位の結果で規則を変えないのが大事です。</div></div>
    <div class="card"><h2>最近のサインと結果 <small>全ペア</small></h2>
      <table><tr><th>入った日</th><th>ペア</th><th>向き</th><th>損益</th></tr>${rec}</table></div>
    <details class="card"><summary>2026年9月に判定の方法を変えた理由</summary>
      <div class="note" style="color:var(--text)">
      以前の判定（RSI・ボリンジャー・移動平均・MACDの点数）を2004年からの22年分で測り直したところ、<b>勝っていたのは直近5年だけ</b>で、22年通算ではほぼトントン（PF1.03）でした。
      そこで、よく知られた売買規則の型を並べて<b>2004〜2018年だけで選び、2019年以降で確かめる</b>方法で選び直し、残ったのが今の規則（RSIが${r.buyAt}/${r.sellAt}を越えた時に入り、損切りは1日の値幅×${r.slAtr}、1週間で手仕舞い）です。
      周りの設定（しきい値20〜30、損切り2〜4、期限3〜7日）もほぼすべて勝ち越しで、1点だけの当たりではありません。<br><br>
      ・サインの2日目・3日目に入ると負け越し → 越えた最初だけ<br>
      ・ペアごとの過去成績は次の期間を当てられなかった → ペア別の見送りはしない<br>
      ・判定の時刻は固定しない（どの時刻でも成り立ち、1時間ごとに判定する形が直近では一番良かった）
      </div></details>`;
}

// ---------- 設定・用語 ----------
function renderSettings(){
  app().innerHTML = `
    <div class="card"><h2>資金とリスク</h2>
      <div class="field"><label>資金（円）</label><input id="bal" inputmode="numeric" placeholder="例 1000000" value="${balance || ""}"></div>
      <div class="field"><label>1回で失ってよい割合</label><select id="risk">${[0.5, 1, 2, 3, 5].map(v => `<option value="${v}" ${v === riskPct ? "selected" : ""}>資金の ${v}%</option>`).join("")}</select></div>
      <div class="note">損切りに届いた時の損がこの割合に収まる Lot 数を計算します。<b>2%以下</b>が一般的です。<br>
        損切りは広め（1日の値幅の3倍）なので、1Lot（1万通貨）で数万円になることがあります。米ドル・ユーロ・ポンド・豪ドルの対円は<b>ミニ（1Lot＝1,000通貨）</b>でも計算します。</div>
      <div class="note" style="margin-top:6px;">この端末の中だけに保存されます。</div></div>
    <details class="card" open><summary>📖 使い方（3ステップ）</summary><div class="note" style="color:var(--text)">
      <b>① 気が向いた時にアプリを開く</b><br>1時間ごとに自動で判定し直しています。「いま入れるペア」が出ていたら、タップして注文手順へ。サインから<b>3時間以内</b>が目安（6時間で締め切り）。<br><br>
      <b>② DMMアプリで入って、損切り（逆指値）を置く</b><br>約定したレートを入れると、損切りの値が出ます。「記録する」を押しておく。<br><br>
      <b>③ 1週間後の同じ時刻ごろに手仕舞う</b><br>ポジションを左にスワイプ →「クイック決済」。それより前に損切りに届いたら何もしない。<br><br>
      サインは11ペア合わせて月に3回ほど。<b>何もしない時間がほとんど</b>で、それが正解です。サインが近いペアは「サインが出る値」をDMMのレート通知に入れておくと見逃しません。</div></details>
    <details class="card"><summary>📖 用語</summary><dl>
      <dt>RSI（行きすぎ度）</dt><dd>最近14日の値上がりと値下がりの割合を0〜100にしたもの。25以下＝売られすぎ、75以上＝買われすぎ。この規則はここだけで判定します。</dd>
      <dt>サイン</dt><dd>RSIが25以下（75以上）に<b>入った最初の時刻</b>。入ったあとも下にいる間は新しいサインにはなりません（2日目以降に入ると負け越した）。</dd>
      <dt>ATR（1日の値幅）</dt><dd>1日にだいたい動く幅の平均。損切りはこの3倍。</dd>
      <dt>損切り（逆指値）</dt><dd>逆に動いたら自動で決済する注文。<b>必ず置く</b>。DMMでは決済の注文タイプ「指値・逆指値」→ 執行条件「逆指値」。</dd>
      <dt>手仕舞い</dt><dd>ポジションを閉じること。この規則では1週間後の同じ時刻ごろ。</dd>
      <dt>クイック決済</dt><dd>DMMのポジション照会で左にスワイプすると出るボタン。その場で決済し、付けていた逆指値は自動で取り消される。</dd>
      <dt>即時注文</dt><dd>いまの値ですぐ売買する注文。新規はこれで入る。</dd>
      <dt>Lot（ロット）</dt><dd>DMMの数量の単位。1Lot＝1万通貨。ペア名に「ミニ」（USM/JPY など）は1Lot＝1,000通貨。</dd>
      <dt>pips（ピップス）</dt><dd>値動きの単位。円のペアは0.01円＝1pip、それ以外は0.0001＝1pip。</dd>
      <dt>スプレッド</dt><dd>買値と売値の差（取引のコスト）。DMMは朝9時〜翌5時が固定で、早朝は広がる。成績はこれを差し引いてあります。</dd>
      <dt>勝率・平均損益・PF</dt><dd>PF＝勝った合計÷負けた合計。1より大きければ続けるほど有利。</dd>
      <dt>ポジション照会・約定レート</dt><dd>いま持っている取引の一覧と、実際に売買できた値段。</dd>
    </dl></details>`;
  $("#bal").addEventListener("change", e => { balance = parseFloat(e.target.value.replace(/[^\d.]/g, "")) || 0; store.set("fx_bal", balance); });
  $("#risk").addEventListener("change", e => { riskPct = parseFloat(e.target.value) || 2; store.set("fx_risk", riskPct); });
}

// ---------- カレンダー（手仕舞いの時刻の通知） ----------
function downloadIcs(x){
  const f = t => new Date(t * 1000).toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const title = `FX手仕舞い ${slash(x.pair)} ${x.dir === 1 ? "買い" : "売り"}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//fx-signal//JA", "BEGIN:VEVENT",
    `UID:${x.pair}-${x.t}@fx-signal`, `DTSTAMP:${f(nowS())}`, `DTSTART:${f(x.exitT)}`, `DTEND:${f(x.exitT + 1800)}`,
    `SUMMARY:${title}`, "DESCRIPTION:DMM ポジション照会 → 左にスワイプ → クイック決済",
    "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = `fx-${x.pair}.ics`; document.body.appendChild(a); a.click(); a.remove();
}

document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { view = b.dataset.v; render(); window.scrollTo(0, 0); }));
$("#refresh").addEventListener("click", () => load(true));
if(DATA) render();          // 前回の値をすぐ出してから、最新を取りに行く
load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
