<!DOCTYPE html>
<html lang="ja">
<head>

<title>ドル円シグナル</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#141b2a; --line:#2a3550;
    --buy:#23c483; --sell:#ff5d6c; --neu:#8896b3;
    --text:#e8edf7; --sub:#9aa7c2; --accent:#ffcf4a;
    --buyBg:rgba(35,196,131,.14); --sellBg:rgba(255,93,108,.14); --accBg:rgba(255,207,74,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0 auto; background:var(--bg); color:var(--text); max-width:520px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;}
  button,input,select{font:inherit; color:inherit;}
  .top{display:flex; align-items:center; gap:8px; margin:2px 0 10px;}
  .top h1{font-size:18px; margin:0; flex:1;}
  .top .upd{font-size:11px; color:var(--sub); text-align:right; line-height:1.3;}
  .iconbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; min-width:40px; height:36px; padding:0 10px; font-size:13px; font-weight:700;}
  .spin{display:inline-block; animation:spin 1s linear infinite;} @keyframes spin{to{transform:rotate(360deg);}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:14px; margin:0 0 8px; color:var(--accent); display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card h2 small{font-size:11px; color:var(--sub); font-weight:600;}
  .hero{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--line); background:var(--card);}
  .hero .k{font-size:12px; color:var(--sub);}
  .hero .big{font-size:22px; font-weight:800; margin:2px 0 4px; line-height:1.35;}
  .hero.go-buy{background:var(--buyBg); border-color:var(--buy);}
  .hero.go-sell{background:var(--sellBg); border-color:var(--sell);}
  .hero .go-row{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border-radius:12px; background:rgba(0,0,0,.25); cursor:pointer;}
  .hero .go-row b{font-size:17px;}
  .hero .go-row .arrow{margin-left:auto; color:var(--sub); font-size:18px;}
  .note{font-size:12px; color:var(--sub); line-height:1.65;}
  .note b{color:var(--text);}
  .banner{background:var(--accBg); border:1px solid var(--accent); color:var(--accent); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px;}
  .warn{background:var(--sellBg); border:1px solid var(--sell); color:#ffb3ba; border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px; font-weight:600;}
  .prow{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; min-height:52px;}
  .prow:last-child{border-bottom:none;}
  .prow:active{background:var(--card2);}
  .pn{flex:0 0 78px; font-weight:800; font-size:14px; line-height:1.2;}
  .pn small{display:block; font-size:10.5px; color:var(--sub); font-weight:600;}
  .gauge{flex:1; min-width:0;}
  .gbar{position:relative; height:8px; border-radius:4px; background:#0c111c; overflow:hidden;}
  .gbar .zb{position:absolute; left:0; top:0; bottom:0; width:25%; background:rgba(35,196,131,.35);}
  .gbar .zs{position:absolute; right:0; top:0; bottom:0; width:25%; background:rgba(255,93,108,.35);}
  .gbar .dot{position:absolute; top:-3px; width:4px; height:14px; margin-left:-2px; border-radius:2px; background:var(--text);}
  .gnum{font-size:11px; color:var(--sub); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip{flex:0 0 auto; font-size:11.5px; font-weight:800; padding:4px 8px; border-radius:8px; white-space:nowrap; background:rgba(136,150,179,.16); color:var(--sub);}
  .chip.buy{background:rgba(35,196,131,.22); color:var(--buy);}
  .chip.sell{background:rgba(255,93,108,.22); color:var(--sell);}
  .chip.acc{background:var(--accBg); color:var(--accent);}
  .back{background:none; border:none; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0; margin-bottom:4px;}
  .dec{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--neu); background:rgba(136,150,179,.1);}
  .dec.buy{border-color:var(--buy); background:var(--buyBg);}
  .dec.sell{border-color:var(--sell); background:var(--sellBg);}
  .dec .pair{font-size:13px; color:var(--sub);}
  .dec .pair b{color:var(--text); font-size:17px;}
  .dec .head{font-size:23px; font-weight:800; margin:4px 0 2px;}
  .dec.buy .head{color:var(--buy);} .dec.sell .head{color:var(--sell);} .dec .head.neu{color:var(--text);}
  .chk{margin-top:10px; background:rgba(0,0,0,.25); border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.7;}
  .chk .ok{color:#8ff0c6;} .chk .ng{color:#ffb3ba; font-weight:700;} .chk .wa{color:var(--accent);}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--sub);}
  .kv b{text-align:right;}
  .steps{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px;}
  .steps h3{font-size:13px; margin:2px 0 6px; color:var(--accent);}
  .steps h4{font-size:12px; color:var(--sub); margin:10px 0 3px; padding-top:8px; border-top:1px dashed var(--line);}
  .st{font-size:12.5px; line-height:1.75; margin:2px 0;}
  .kbd{display:inline-block; padding:0 6px; border:1px solid #3a4763; border-radius:6px; background:#1d2638; font-weight:700; line-height:1.5; white-space:nowrap;}
  .val{font-weight:800; color:var(--accent);}
  .slbox{margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--sellBg); color:#ffb3ba; font-size:12.5px; font-weight:600;}
  .field{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .field label{flex:0 0 118px; font-size:12.5px; color:var(--sub);}
  .field input,.field select{flex:1; min-width:0; padding:10px; border-radius:10px; border:1px solid var(--line); background:#0c111c; color:var(--text); font-size:16px; font-weight:700;}
  .btn{display:block; width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#1a1300; font-weight:800; font-size:15px; margin-top:10px;}
  .btn.ghost{background:transparent; color:var(--accent);}
  .btn.red{background:transparent; color:#ffb3ba; border-color:var(--sell);}
  .btn:active{opacity:.8;}
  .pos{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:var(--card2);}
  .pos.due{border-color:var(--accent); background:var(--accBg);}
  .pos .t{display:flex; justify-content:space-between; gap:8px; font-weight:800;}
  .plus{color:var(--buy);} .minus{color:var(--sell);}
  canvas{width:100%; display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:6px 4px; border-bottom:1px solid var(--line); text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--sub); font-weight:600; font-size:11.5px;}
  details.card > summary{cursor:pointer; color:var(--accent); font-weight:700; list-style:none; display:flex; justify-content:space-between;}
  details.card > summary::after{content:"＋"; color:var(--sub);}
  details.card[open] > summary::after{content:"－";}
  details.card > summary::-webkit-details-marker{display:none;}
  details.card[open] > summary{margin-bottom:8px;}
  .foot{font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}
  .loading{text-align:center; padding:40px 0; color:var(--sub);}
  #toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); opacity:0;
    max-width:min(92vw, 480px); background:#26324a; color:var(--text); border:1px solid var(--accent); border-radius:12px;
    padding:10px 14px; font-size:13px; font-weight:700; line-height:1.5; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.45);
    transition:opacity .2s, transform .2s; pointer-events:none; z-index:10;}
  #toast.show{opacity:1; transform:translate(-50%, 0);}
  dl{margin:0; line-height:1.55;}
  dt{color:var(--accent); font-weight:700; margin-top:10px; font-size:13px;}
  dd{margin:2px 0 0; font-size:12.5px;}
  .tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px;}
  .tabs button{padding:10px 0; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:13px; font-weight:700;}
  .tabs button.on{background:var(--accent); color:#1a1300; border-color:var(--accent);}
  .ybar{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:3px 0;}
  .ybar .y{flex:0 0 36px; color:var(--sub);}
  .ybar .b{flex:1; position:relative; height:12px;}
  .ybar .b i{position:absolute; top:0; bottom:0; border-radius:3px;}
  .ybar .v{flex:0 0 52px; text-align:right;}
</style>
</head>
<body>
  <div class="top">
    <h1>ドル円シグナル</h1>
    <div class="upd" id="upd"></div>
    <button class="iconbtn" id="refresh" aria-label="更新">↻</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="home" class="on">いま</button>
    <button data-v="stats">成績</button>
    <button data-v="set">設定・用語</button>
  </div>
  <div id="app"><div class="loading">読み込み中…</div></div>
  <div class="foot">ドル円（USD/JPY）だけを自動で判定しています（GitHub が計算・APIキー不要）<br>※参考情報です。必ず勝てる方法はありません。最終判断は自己責任で。</div>

<script>
"use strict";
// ================= 基本 =================
const P = "USDJPY", MINI = "USM/JPY";            // DMM のミニ（1Lot＝1,000通貨）
// データは自動の計算が専用の枝（data）に上書きする。リポジトリの履歴を膨らませないため
const DATA_URLS = ["https://raw.githubusercontent.com/hybs02/fx/data/data.json", "data.json"];
const $ = s => document.querySelector(s);
const app = () => $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = store.get("uj_cache", null), FUND = store.get("uj_fund", null);
let balance = +store.get("fx_bal", 0) || 0;
let riskPct = +store.get("fx_risk", 2) || 2;
// 記録した取引（この端末の中だけ）。11ペア版の記録が残っていればドル円の分だけ引き継ぐ
let positions = store.get("uj_pos", null) || store.get("fx_pos", []).filter(x => x.pair === P && x.t && x.exitT);
let view = "home", loading = false, lastFetch = 0;

const fx = v => v == null ? "—" : (+v).toFixed(3);
const yen = v => (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString();
const sgn = v => (v > 0 ? "+" : "") + v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W = ["日","月","火","水","木","金","土"];
const nowS = () => Date.now() / 1000;
const livePrice = () => DATA.live ? DATA.live.p : DATA.price;
// 時刻（UNIX 秒）→ 日本時間の表示
function tj(t, withDay = true){
  const d = new Date(t * 1000 + 9 * 3600e3);
  const hm = `${d.getUTCHours()}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
  return withDay ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${W[d.getUTCDay()]}) ${hm}` : hm;
}
function jd(iso){ const [y,m,d] = iso.split("-").map(Number); return `${m}/${d}(${W[new Date(Date.UTC(y,m-1,d)).getUTCDay()]})`; }
const isoJ = t => new Date(t * 1000 + 9 * 3600e3).toISOString().slice(0, 10);
const isoAdd = (iso, n) => new Date(Date.parse(iso + "T00:00:00Z") + n * 86400e3).toISOString().slice(0, 10);
function hrs(sec){ const m = Math.max(0, Math.round(sec / 60)); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + "分" : ""}` : `${m}分`; }
function ymJ(t){ const d = new Date(t * 1000 + 9 * 3600e3); return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月`; }
// DMM FX で取引できる時刻か（日本時間 月曜7:00〜土曜5:50。冬時間は6:50までだが安全側で5:50）。logic.dmm_open と同じ
function dmmOpen(t = nowS()){
  const d = new Date(t * 1000 + 9 * 3600e3), w = d.getUTCDay(), m = d.getUTCHours() * 60 + d.getUTCMinutes();
  return !(w === 0 || (w === 6 && m >= 350) || (w === 1 && m < 420));
}
// 入った時刻の1週間後。取引時間外（土曜の朝）に当たる時は、その前で最後に取引できる時刻（logic.exit_time と同じ）
function exitTime(te){ let t = te + 7 * 86400; while(!dmmOpen(t)) t -= 3600; return t; }
// 日本時間のその日の h 時（UNIX 秒）
function atHourJ(t, h){ const d = new Date(t * 1000 + 9 * 3600e3); d.setUTCHours(h, 0, 0, 0); return d.getTime() / 1000 - 9 * 3600; }
// 手仕舞いの時刻を1日過ぎても残っている記録（消し忘れ）は、保有中に数えない
const expired = x => nowS() > x.exitT + 86400;
const holding = () => positions.find(x => !expired(x));
let typedFill = null;   // 打ち込んだ約定レート（自動の読み込みで描き直しても消えないように）

// 資金とリスク%から Lot 数（1Lot＝1万通貨で 1pip＝100円。足りなければミニ 1Lot＝1,000通貨）
function lotPlan(slPips){
  const perLot = slPips * 100;
  if(!(balance > 0)) return {set:false, perLot};
  const cap = balance * riskPct / 100;
  const lots = Math.floor(cap / perLot);
  if(lots >= 1) return {set:true, lots, mini:false, units:lots * 10000, loss:lots * perLot, cap, perLot};
  const ml = Math.floor(cap / (perLot / 10));
  if(ml >= 1) return {set:true, lots:ml, mini:true, units:ml * 1000, loss:ml * perLot / 10, cap, perLot};
  return {set:true, lots:0, cap, perLot};
}

// ================= データ =================
// 12 秒で打ち切る fetch（通信が止まっても「読み込み中」のまま固まらないように）
async function getJson(url, opts = {}){
  const c = new AbortController(), timer = setTimeout(() => c.abort(), 12000);
  try{
    const r = await fetch(url, {cache:"no-store", signal:c.signal, ...opts});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }catch(e){ throw e.name === "AbortError" ? new Error("通信が12秒で終わらなかった") : e; }
  finally{ clearTimeout(timer); }
}
// ↻ を押した時だけ GitHub API から直接読む（raw は 5 分キャッシュされ、押しても古い値が返ることがあるため）
const API_URL = "https://api.github.com/repos/hybs02/fx/contents/data.json?ref=data";
function toast(msg){
  let el = $("#toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; document.body.appendChild(el); }
  el.innerHTML = msg; el.className = "show";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.className = "", 4000);
}
const usable = d => d && d.pair === P && d.stats;
async function load(manual = false){
  if(loading){ if(manual) toast("いま読み込み中です…"); return; }
  loading = true; $("#refresh").innerHTML = '<span class="spin">↻</span>';
  const started = Date.now(), before = DATA && DATA.updatedTs;
  try{
    const t = Date.now();
    const srcs = (manual ? [[API_URL, {headers:{Accept:"application/vnd.github.raw+json"}}]] : [])
      .concat(DATA_URLS.map(u => [u + "?t=" + t, {}]));
    let d = null, lastErr = null;
    for(const [u, o] of srcs){
      try{ d = await getJson(u, o); if(usable(d)) break; d = null; }catch(e){ lastErr = e; }
    }
    if(!d) throw lastErr || new Error("ドル円のデータがまだありません");
    const f = await getJson("fundamentals.json?t=" + t).catch(() => null);
    lastFetch = Date.now();
    const wait = 500 - (Date.now() - started); if(wait > 0) await new Promise(r => setTimeout(r, wait));   // 押したことが分かるように
    // 自動の読み込み（5分キャッシュの raw）が、↻ で取った新しい値を古い値で上書きしないように
    if(!(DATA && d.updatedTs < DATA.updatedTs)){
      const old = DATA, oldF = FUND;
      DATA = d; if(f) FUND = f;
      try{ paint(manual); }
      catch(err){ DATA = old; FUND = oldF; throw new Error("表示できませんでした（" + err.message + "）"); }
      store.set("uj_cache", DATA); if(f) store.set("uj_fund", FUND);     // 描けた物だけ保存する
    }
    if(manual) toast(before && d.updatedTs <= before
      ? `いまの表示が最新です（${tj(d.updatedTs)} の計算）<br><span style="font-weight:400">自動の計算は GitHub が混んでいると数時間おきになります</span>`
      : `新しい計算を取り込みました（${tj(d.updatedTs)}）`);
  }catch(e){
    if(!DATA) app().innerHTML = `<div class="warn">データを読み込めませんでした（${esc(e.message)}）。通信を確認して ↻ を押してください。</div>`;
    else $("#upd").innerHTML = '<span style="color:var(--sell)">通信できず前回の値</span>';
    if(manual) toast(`読み込めませんでした（${esc(e.message)}）`);
  }finally{ loading = false; $("#refresh").textContent = "↻"; }
}
// 数字を打ち込んでいる最中は描き直さない（入力と画面の位置が飛ばないように）。打ち終わってから描く
let pendingPaint = false;
function paint(force){
  const a = document.activeElement;
  if(!force && a && a.tagName === "INPUT"){ pendingPaint = true; return; }
  pendingPaint = false; render();
}
document.addEventListener("focusout", () => { if(pendingPaint) setTimeout(() => paint(true), 0); });
// 開いている間は 10 分ごとに最新を取りに行く／しばらく裏にいた後で戻ったら取りに行く
setInterval(() => { if(document.visibilityState === "visible") load(); }, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && Date.now() - lastFetch > 5 * 60e3) load(); });
// 右上の「何分前」を1分ごとに書き直す
setInterval(() => { if(DATA) $("#upd").innerHTML = `${tj(DATA.updatedTs, false)} の計算<br>${hrs(nowS() - DATA.updatedTs)}前`; }, 60e3);

// ================= 判定（画面で決めるのは「経過時間」と「あなたの事情」だけ） =================
// サイン（RSI・損切り幅・手仕舞いの目安）は build.py が計算済み。ここでは
//   ・サインから何時間たったか（3時間以内が目安・8時間を過ぎたら見送り）
//   ・介入警戒（買い）・資金・保有中か・発表・早朝
// を突き合わせて「入る／見送り／様子見」を1つに決める。
const hourJ = () => new Date(Date.now() + 9 * 3600e3).getUTCHours();
// 介入警戒でその向きを止めるか（dangerDir "up"＝上がると介入→買いを止める／"down"＝売りを止める）
function alertNow(price = livePrice()){
  const al = FUND && FUND.pairAlerts && FUND.pairAlerts[P];
  if(!al || price == null) return null;
  if(al.dangerDir === "up" && price >= al.level - al.near) return al;
  if(al.dangerDir === "down" && price <= al.level + al.near) return al;
  return null;
}
const vetoes = (al, dir) => al && ((al.dangerDir === "up" && dir === 1) || (al.dangerDir === "down" && dir === -1));
function eventsBetween(fromIso, toIso){
  return FUND ? (FUND.events || []).filter(e => e.date >= fromIso && e.date <= toIso) : [];
}
const evText = e => `${jd(e.date)} ${e.time} ${e.name}`;
function decide(){
  const r = DATA.rule, S = DATA.sig;
  if(!S) return {kind:"WAIT", rows:[]};
  const rows = [], ng = [], wa = [];
  const add = (s, t) => { rows.push({s, t}); if(s === "ng") ng.push(t); if(s === "wa") wa.push(t); };
  const dir = S.dir, dn = dir === 1 ? "買い" : "売り";
  const mine = holding();
  if(mine && mine.t >= S.t - 3600)
    return {kind:"DONE", dir, dn, rows:[{s:"ok", t:`記録済み：${tj(mine.t)} に ${fx(mine.entry)} で入った。手仕舞いは ${tj(mine.exitT)} ごろ`}], ng:[], wa:[]};
  const now = nowS(), age = now - S.t, deadline = S.t + r.limit * 3600, left = deadline - now;
  let later = null;
  if(!dmmOpen()) add("ng", "取引時間外：いまDMMは閉まっている（月曜7:00〜土曜5:50）。開く前に締め切りを過ぎるので見送り");
  else if(left <= 0) add("ng", `時間：サインから${r.limit}時間を過ぎた（次のサインを待つ）`);
  else if(age > r.best * 3600) add("wa", `時間：サインから${hrs(age)}。${r.best}時間以内が目安（締め切り ${tj(deadline, false)}）`);
  else add("ok", `サイン：${tj(S.t)} に RSI ${S.from}→${S.to} で${dir === 1 ? r.buyAt + "以下" : r.sellAt + "以上"}に入った（${hrs(age)}前）`);
  // 早朝 5〜9 時はスプレッドが広い（ドル円 0.2銭→数銭）。締め切りまでに9時が来るなら9時を待つ
  const nine = atHourJ(now, 9), hj = hourJ();
  if(dmmOpen() && left > 0 && hj >= 5 && hj < 9){
    if(deadline > nine + 600){ later = nine; add("wa", `早朝：5〜9時はスプレッドが大きく広がる（DMMの固定は9時〜翌5時）。${tj(nine, false)}になってから入る（締め切り ${tj(deadline, false)} に間に合う）`); }
    else add("wa", `早朝：スプレッドが広い時間だが、9時には締め切り（${tj(deadline, false)}）を過ぎる。入るならいま（広いスプレッドのぶん少し不利）`);
  }
  if(vetoes(alertNow(), dir)) add("ng", `介入警戒：介入が入りやすい水準。いまの『${dn}』は入らない`);
  if(mine) add("ng", "保有中：もう持っている（持つのは1つだけ）");
  const lp = lotPlan(S.atrPips * r.slAtr);
  if(!lp.set) add("wa", "資金：未設定（設定タブで資金を入れると Lot 数と損失額が出る）");
  else if(lp.lots < 1) add("ng", `資金：最小のミニ1Lotでも損切り時の損が${yen(lp.perLot / 10)}で、上限${yen(lp.cap)}（資金の${riskPct}%）を超える`);
  else add("ok", `資金：${lp.mini ? "ミニ " : ""}${lp.lots}Lot なら損切り時の損は${yen(lp.loss)}（資金の${(lp.loss / balance * 100).toFixed(1)}%）`);
  const today = isoJ(now), ev1 = eventsBetween(today, isoAdd(today, 1));
  if(ev1.length) add("wa", `発表：${ev1.map(evText).join("、")}。値が飛びやすい（損切りは必ず置く）`);
  const evHold = eventsBetween(isoAdd(today, 2), isoJ(exitTime(now)));
  if(evHold.length) add("wa", `持っている間の発表：${evHold.map(evText).join("、")}。判定には入れていない（検証していないため）`);
  return {kind: ng.length ? "NO" : (later ? "LATER" : "GO"), dir, dn, rows, ng, wa, lp, later};
}

// ================= 描画 =================
function render(){
  if(!DATA) return;
  $("#upd").innerHTML = `${tj(DATA.updatedTs, false)} の計算<br>${hrs(nowS() - DATA.updatedTs)}前`;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  if(view === "stats") return renderStats();
  if(view === "set") return renderSettings();
  renderHome();
}
function staleNote(){
  // GitHub の定時実行は混むと数時間おきになる。締め切り（8時間）を過ぎるほど古いと、サインを見逃しているかもしれない
  const age = nowS() - DATA.updatedTs, r = DATA.rule;
  if(!dmmOpen()) return "";
  if(age > r.limit * 3600) return `<div class="warn">⚠ 最後の計算から${hrs(age)}たっています（GitHub の自動実行が止まっているか大きく遅れています）。この間に出たサインは載っていないかもしれません。↻ を押しても変わらなければ、GitHub の Actions で「Run workflow」を押してください。</div>`;
  if(age > r.best * 3600) return `<div class="banner">最後の計算から${hrs(age)}たっています（GitHub の自動実行は混んでいると数時間おきになります）。判定は ${tj(DATA.updatedTs)} 時点。</div>`;
  return "";
}
function gauge(){
  const r = DATA.rule, v = Math.max(1, Math.min(99, DATA.rsi));
  return `<div class="gbar" style="margin-top:10px"><div class="zb" style="width:${r.buyAt}%"></div><div class="zs" style="width:${100 - r.sellAt}%"></div><div class="dot" style="left:${v}%"></div></div>
    <div class="gnum">RSI <b style="color:var(--text)">${DATA.rsi}</b>（1時間前 ${DATA.rsiPrev}）　緑＝${r.buyAt}以下で買い・赤＝${r.sellAt}以上で売り</div>`;
}
function decisionCard(){
  const r = DATA.rule, d = decide(), S = DATA.sig;
  const cls = ["GO", "DONE", "LATER"].includes(d.kind) ? (d.dir === 1 ? "buy" : "sell") : "";
  let head, sub;
  if(!dmmOpen() && d.kind === "WAIT"){ head = "取引時間外"; sub = "DMMは月曜の朝7時に再開します。下は金曜の終わりの状態です。"; }
  else if(d.kind === "GO"){ head = `${d.dn}で入ってOK`; sub = `サインから${r.best}時間以内が目安（締め切り ${tj(S.t + r.limit * 3600, false)}）` + (d.wa.length ? "・△を読んでから" : ""); }
  else if(d.kind === "LATER"){ head = `${d.dn}は ${tj(d.later, false)} に入る`; sub = "早朝はスプレッドが広いので、9時になってから下の手順で入る"; }
  else if(d.kind === "DONE"){ head = `${d.dn}で入りました`; sub = "あとは損切り（逆指値）を置いて、手仕舞いの時刻を待つだけ"; }
  else if(d.kind === "NO"){ head = `${d.dn}サインだが見送り`; sub = "理由：" + d.ng.map(t => t.split("：")[0]).join("・"); }
  else { head = "様子見（何もしない）"; sub = `サインは年に5〜6回ほど。${r.buyAt}以下か${r.sellAt}以上に入った時だけ動きます。`; }
  const mark = {ok:"✔", ng:"✖", wa:"△"};
  const chk = d.rows.length ? `<div class="chk">${d.rows.map(x => `<div class="${x.s}">${mark[x.s]} ${esc(x.t)}</div>`).join("")}</div>` : "";
  return {d, html: `<div class="dec ${cls}"><div class="pair"><b>USD/JPY</b>　米ドル/円　いま <b>${fx(livePrice())}</b></div>
    <div class="head ${cls ? "" : "neu"}">${head}</div><div class="note">${sub}</div>${gauge()}${chk}</div>`};
}
function renderHome(){
  const {d, html: dec} = decisionCard(), S = DATA.sig;
  const al = alertNow();
  let html = staleNote() + dec;
  if(al) html += `<div class="warn">⚠ ${esc(al.note)}</div>`;
  if(d.kind === "GO" || d.kind === "LATER") html += orderCard(S.dir, true);
  html += positionsHtml() + triggerCard() + eventStrip() + guardCard() + swapCard();
  html += `<div class="card"><h2>チャート <small>毎日${tj(DATA.t, false)}の値・90日</small></h2><canvas id="cv" height="260"></canvas>
    <div class="note">上：値段　下：RSI（緑の帯＝${DATA.rule.buyAt}以下、赤の帯＝${DATA.rule.sellAt}以上）。▲▼＝過去のサイン</div></div>`;
  html += activeCard();
  if(d.kind !== "GO" && d.kind !== "LATER"){
    const dir = S ? S.dir : (DATA.rsi < 50 ? 1 : -1);
    html += `<details class="card"><summary>${d.kind === "DONE" ? "注文手順（損切り・手仕舞いの確認）" : d.kind === "NO" ? "参考：それでも入るなら（注文手順）" : "参考：注文のしかた（サインが出た時用）"}</summary>${orderCard(dir, false)}</details>`;
  }
  html += refCard() + fundCard();
  app().innerHTML = html;
  app().querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", () => {
    const k = +el.dataset.close;
    if(confirm("この取引の記録を消しますか？（DMMで決済したあとに押す）")){ positions.splice(k, 1); store.set("uj_pos", positions); render(); }
  }));
  app().querySelectorAll("[data-ics]").forEach(el => el.addEventListener("click", () => downloadIcs(positions[+el.dataset.ics])));
  bindOrder(); drawChart();
}
function positionsHtml(){
  const now = nowS(), live = livePrice(), sw = DATA.swap;
  const mine = positions.map((x, k) => {
    const units = x.units || 10000;
    const days = Math.max(0, (Math.min(now, x.exitT) - x.t) / 86400);
    const swapYen = sw ? (x.dir === 1 ? sw.buy : sw.sell) * units / 10000 * Math.floor(days) : 0;
    const pnl = (live - x.entry) * x.dir * units;
    const due = x.exitT <= now, soon = !due && x.exitT - now < 3600, old = expired(x);
    const stopHit = x.dir === 1 ? live <= x.stop : live >= x.stop;
    const when = old ? `手仕舞いの時刻（${tj(x.exitT)}）を1日以上過ぎています。DMMで決済したら「手仕舞った（消す）」を押してください（残っていても保有中には数えません）`
      : due ? "手仕舞いの時刻です" : soon ? `まもなく手仕舞い（${tj(x.exitT, false)}）` : "手仕舞い " + tj(x.exitT) + " ごろ";
    return `<div class="pos ${due || soon ? "due" : ""}">
      <div class="t"><span>USD/JPY ${x.dir === 1 ? "買い" : "売り"} ${x.mini ? "ミニ" : ""}${x.lots}Lot</span>
        <span class="${pnl >= 0 ? "plus" : "minus"}">${pnl >= 0 ? "+" : ""}${yen(pnl)}</span></div>
      <div class="note">入った ${tj(x.t)} ${fx(x.entry)} ／ 損切り ${fx(x.stop)} ／ いま ${fx(live)}${sw ? `<br>スワップ（概算・別に付く）${swapYen >= 0 ? "+" : ""}${yen(swapYen)}` : ""}</div>
      <div class="note" style="color:${due || soon ? "var(--accent)" : "var(--sub)"}"><b style="color:inherit">${when}</b>
        ${due && !old ? "：ポジション照会 → 左にスワイプ →『クイック決済』（逆指値は自動で取消）" : ""}
        ${stopHit ? "<br>損切りの値に届いている可能性があります。DMMで確認を。" : ""}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" style="padding:9px; font-size:13px;" data-ics="${k}">カレンダーに入れる</button>
        <button class="btn red" style="padding:9px; font-size:13px;" data-close="${k}">手仕舞った（消す）</button></div></div>`;
  }).join("");
  if(!mine) return "";
  return `<div class="card"><h2>持っている取引 <small>記録した分</small></h2>${mine}
    <div class="note" style="margin-top:6px;">損益はおおよそ（${tj(DATA.updatedTs, false)}ごろの値）。正確な値はDMMアプリで。</div></div>`;
}
function eventStrip(){
  if(!FUND) return "";
  const today = isoJ(nowS()), ev = eventsBetween(today, isoAdd(today, 6));
  if(!ev.length) return "";
  const soon = ev.some(e => e.date <= isoAdd(today, 1));
  return `<details class="card" ${soon ? "open" : ""}><summary>📅 この1週間の日米の重要発表（${ev.length}件）</summary>
    ${ev.map(e => `<div class="kv"><span>${jd(e.date)} ${e.time}</span><b>${esc(e.name)}</b></div>`).join("")}
    <div class="note" style="margin-top:6px;">発表の前後は値が飛びやすい。サインの判定には使っていません（検証していないため）。</div></details>`;
}
// 介入警戒の水準までの距離（ドル円は円安が行きすぎると財務省が円買い介入をする）
function guardCard(){
  const al = FUND && FUND.pairAlerts && FUND.pairAlerts[P];
  if(!al) return "";
  const p = livePrice(), stopAt = al.level - al.near;
  const dist = (stopAt - p) * 100;
  return `<div class="card"><h2>介入警戒 <small>${FUND.updated} 時点の水準</small></h2>
    <div class="kv"><span>買いを止める水準</span><b>${stopAt.toFixed(2)}円 以上</b></div>
    <div class="kv"><span>市場が本格介入を警戒する水準</span><b>${al.level.toFixed(2)}円</b></div>
    <div class="kv"><span>いまの値から</span><b class="${dist > 0 ? "" : "minus"}">${dist > 0 ? `あと ${dist.toFixed(0)}pips（${(stopAt - p).toFixed(2)}円）` : "警戒の水準に入っている"}</b></div>
    <div class="note" style="margin-top:6px;">介入は不意打ちで数円下げる。この水準より上では新しい『買い』は入りません（売りは止めない）。</div></div>`;
}
function swapCard(){
  const sw = DATA.swap; if(!sw) return "";

  return `<div class="card"><h2>スワップの目安 <small>1万通貨（1Lot）</small></h2>
    <div class="kv"><span>買い（1日）</span><b class="plus">+${yen(sw.buy)}</b></div>
    <div class="kv"><span>売り（1日）</span><b class="minus">${yen(sw.sell)}</b></div>

      成績はこのスワップも足して計算しています（1週間では値動きに比べて小さく、判定は変えない）。</div></div>`;

function orderCard(dir, primary){

  const eh = new Date(exitT * 1000 + 9 * 3600e3).getUTCHours(), exNine = atHourJ(exitT, 9);

      : `<div class="warn" style="margin:8px 0 0">資金${yen(balance)}・リスク${riskPct}%では、最小のミニ1Lotでも損切り時の損（約${yen(lp.perLot / 10)}）が上限${yen(lp.cap)}を超えます。資金を増やすかリスク%を上げない限り、見送りが安全です。</div>`)
      : `<div class="note">1Lot（1万通貨）で損切りに届いた時の損は <b class="minus">約${yen(lp.perLot)}</b>（ミニ ${MINI} なら1Lot＝1,000通貨で 約${yen(lp.perLot / 10)}）。多すぎる時は入らない。<b>設定タブで資金を入れる</b>と、あなたに合った Lot 数を出します。</div>`}
    <div class="steps">
      <h3>STEP1　いま「${dn}」で入る（新規・即時）</h3>
      <div class="st">① ${K("トレード")} → 通貨ペア <b>${sym}</b> → ${K(btn)}</div>
      <div class="st">② 注文タイプ ${K("即時")}／売買 <span class="val">${dir === 1 ? "買" : "売"}</span>／注文数量 <span class="val">${lots} Lot</span></div>
      <div class="st">③ ${K("損切")} は <span class="val">OFF</span>（STEP2 で正確な値を入れる）→ ${K("確認画面")} → ${K("注文")}</div>
      <h4>STEP2　損切りを予約する（決済・逆指値）</h4>

      <div class="st">⑥ 注文レートに <span class="val slv">—</span>／有効期限 ${K("無期限")} → ${K("確認画面")} → ${K("注文")}</div>
      <div class="st">利確（指値）は<b>置きません</b>。検証では1週間で手仕舞う方が良かったため。損切りは介入などの急変に備える保険で、22年の検証では1回も届いていません。</div>
      <h4>STEP3　入った1週間後に手仕舞う（いま入れば ${tj(exitT)} ごろ）</h4>

        : `<div class="st" style="color:var(--accent)">土曜はDMMが5:50に閉まるので、それまでに手仕舞う（週末に持ち越さない）。</div>`) : ""}
      <div class="st">⑦ ${K("ポジション照会")} → ポジションを<b>左にスワイプ</b> → ${K("クイック決済")} → ${K("クイック決済")}</div>

    </div>
    ${primary ? `<button class="btn rec">入った！この内容で記録する</button>
      <div class="note" style="margin-top:6px;">記録すると、この画面に手仕舞いの時刻と損益の目安が出ます（この端末の中だけに保存）。</div>` : ""}
  </div>`;
}
function bindOrder(){
  const r = DATA.rule;
  ["o1", "o2"].forEach(id => {
    const box = document.getElementById(id); if(!box) return;
    const dir = +box.dataset.dir, atr = +box.dataset.atr, inp = box.querySelector(".fill");
    const num = () => parseFloat(String(inp.value).replace(/[^\d.]/g, ""));
    const show = () => { const f = num(); box.querySelectorAll(".slv").forEach(x => x.textContent = f > 0 ? fx(f - dir * r.slAtr * atr) : "—"); };
    inp.addEventListener("input", () => { typedFill = inp.value; show(); });
    show();
    const rec = box.querySelector(".rec");
    if(rec) rec.addEventListener("click", () => {
      const f = num();
      if(!(f > 0)){ alert("約定したレートを入れてください"); return; }
      const lp = lotPlan(DATA.sig.atrPips * r.slAtr), lots = lp.set && lp.lots >= 1 ? lp.lots : 1;
      const t = Math.round(nowS());
      positions = [{pair:P, dir, entry:f, stop:+(f - dir * r.slAtr * atr).toFixed(3), lots, mini:!!lp.mini,
        units: lp.mini ? lots * 1000 : lots * 10000, t, exitT: exitTime(t)}];
      store.set("uj_pos", positions); typedFill = null;
      render(); window.scrollTo(0, 0);
    });
  });
}
function triggerCard(){
  const r = DATA.rule, b = DATA.trig.buy, s = DATA.trig.sell, p = DATA.price;
  const pct = v => ((v / p - 1) * 100).toFixed(1), pips = v => Math.abs((v - p) * 100).toFixed(0);
  return `<div class="card"><h2>サインが出る値 <small>次の1時間</small></h2>

// ---------- チャート ----------
function drawChart(){
  const cv = $("#cv"); if(!cv) return;
  const r = DATA.rule, ch = DATA.chart;
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth, Ht = 260;
  cv.width = Wd * dpr; cv.height = Ht * dpr; cv.style.height = Ht + "px";
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const N = ch.c.length, L = 6, R = 52, T1 = 8, B1 = 150, T2 = 168, B2 = 250;
  const x = i => L + (Wd - L - R) * i / (N - 1);
  const lo = Math.min(...ch.c), hi = Math.max(...ch.c), pad = (hi - lo) * 0.08 || 0.01;
  const y1 = v => T1 + (B1 - T1) * (1 - (v - lo + pad) / (hi - lo + 2 * pad));
  const y2 = v => T2 + (B2 - T2) * (1 - v / 100);
  g.font = "11px sans-serif"; g.fillStyle = "#9aa7c2";
  g.strokeStyle = "#2a3550"; g.lineWidth = 1;
  [lo, (lo + hi) / 2, hi].forEach(v => { g.beginPath(); g.moveTo(L, y1(v)); g.lineTo(Wd - R, y1(v)); g.stroke(); g.fillText(v.toFixed(2), Wd - R + 4, y1(v) + 4); });
  // 介入警戒の水準（グラフの範囲に入っている時だけ）
  const al = FUND && FUND.pairAlerts && FUND.pairAlerts[P];
  if(al){ const lv = al.level - al.near; if(lv > lo - pad && lv < hi + pad){ g.strokeStyle = "rgba(255,93,108,.6)"; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(L, y1(lv)); g.lineTo(Wd - R, y1(lv)); g.stroke(); g.setLineDash([]); } }
  g.strokeStyle = "#5b8cff"; g.lineWidth = 2; g.beginPath();
  ch.c.forEach((v, i) => i ? g.lineTo(x(i), y1(v)) : g.moveTo(x(i), y1(v))); g.stroke();
  g.fillStyle = "rgba(35,196,131,.18)"; g.fillRect(L, y2(r.buyAt), Wd - L - R, y2(0) - y2(r.buyAt));
  g.fillStyle = "rgba(255,93,108,.18)"; g.fillRect(L, y2(100), Wd - L - R, y2(r.sellAt) - y2(100));
  g.fillStyle = "#9aa7c2"; [r.buyAt, 50, r.sellAt].forEach(v => g.fillText(String(v), Wd - R + 4, y2(v) + 4));
  g.strokeStyle = "#ffcf4a"; g.lineWidth = 2; g.beginPath();
  ch.r.forEach((v, i) => i ? g.lineTo(x(i), y2(v)) : g.moveTo(x(i), y2(v))); g.stroke();
  // 過去のサイン（1時間ごとの判定で出た時刻を、いちばん近い日の位置に置く）
  (ch.ev || []).forEach(e => {
    let i = ch.t.findIndex(t => t >= e.t); if(i < 0) i = N - 1;
    const s = e.dir, yy = y1(ch.c[i]) + (s === 1 ? 12 : -12);
    g.fillStyle = s === 1 ? "#23c483" : "#ff5d6c"; g.beginPath();
    g.moveTo(x(i), yy - 6 * s); g.lineTo(x(i) - 6, yy + 5 * s); g.lineTo(x(i) + 6, yy + 5 * s); g.fill();
  });
  g.fillStyle = "#9aa7c2"; g.textAlign = "left"; g.fillText(tj(ch.t[0]).split(" ")[0], L, Ht - 2);
  g.textAlign = "right"; g.fillText(tj(ch.t[N - 1]).split(" ")[0], Wd - R, Ht - 2);
}
