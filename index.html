<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FXシグナル">

<link rel="icon" href="apple-touch-icon.png">

<title>FX シグナル</title>
<style>
  :root{
    --bg:#0f1420; --card:#1a2233; --card2:#141b2a; --line:#2a3550;
    --buy:#23c483; --sell:#ff5d6c; --neu:#8896b3;
    --text:#e8edf7; --sub:#9aa7c2; --accent:#ffcf4a;
    --buyBg:rgba(35,196,131,.14); --sellBg:rgba(255,93,108,.14); --accBg:rgba(255,207,74,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{margin:0 auto; background:var(--bg); color:var(--text); max-width:520px;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",sans-serif;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    font-size:14px; line-height:1.55; -webkit-text-size-adjust:100%;}
  button{font:inherit; color:inherit;}
  .top{display:flex; align-items:center; gap:8px; margin:2px 0 10px;}
  .top h1{font-size:18px; margin:0; flex:1;}
  .top .upd{font-size:11px; color:var(--sub); text-align:right; line-height:1.3;}
  .iconbtn{border:1px solid var(--line); background:var(--card); border-radius:10px; min-width:40px; height:36px;
    padding:0 10px; font-size:13px; font-weight:700;}
  .iconbtn:active{background:var(--card2);}
  .spin{display:inline-block; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:14px; margin:0 0 8px; color:var(--accent); display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card h2 small{font-size:11px; color:var(--sub); font-weight:600;}
  .hero{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--line); background:var(--card);}
  .hero .k{font-size:12px; color:var(--sub);}
  .hero .big{font-size:22px; font-weight:800; margin:2px 0 4px; line-height:1.35;}
  .hero.go-buy{background:var(--buyBg); border-color:var(--buy);}
  .hero.go-sell{background:var(--sellBg); border-color:var(--sell);}
  .hero.wait{background:var(--card);}
  .hero .go-row{display:flex; align-items:center; gap:10px; padding:10px 12px; margin-top:8px; border-radius:12px;
    background:rgba(0,0,0,.25); cursor:pointer;}
  .hero .go-row b{font-size:17px;}
  .hero .go-row .arrow{margin-left:auto; color:var(--sub); font-size:18px;}
  .note{font-size:12px; color:var(--sub); line-height:1.65;}
  .note b{color:var(--text);}
  .banner{background:var(--accBg); border:1px solid var(--accent); color:var(--accent);
    border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px;}
  .warn{background:var(--sellBg); border:1px solid var(--sell); color:#ffb3ba;
    border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.6; margin-bottom:12px; font-weight:600;}
  /* ペア一覧 */
  .prow{display:flex; align-items:center; gap:10px; padding:11px 4px; border-bottom:1px solid var(--line); cursor:pointer; min-height:52px;}
  .prow:last-child{border-bottom:none;}
  .prow:active{background:var(--card2);}
  .pn{flex:0 0 78px; font-weight:800; font-size:14px; line-height:1.2;}
  .pn small{display:block; font-size:10.5px; color:var(--sub); font-weight:600;}
  .gauge{flex:1; min-width:0;}
  .gbar{position:relative; height:8px; border-radius:4px; background:#0c111c; overflow:hidden;}
  .gbar .zb{position:absolute; left:0; top:0; bottom:0; width:25%; background:rgba(35,196,131,.35);}
  .gbar .zs{position:absolute; right:0; top:0; bottom:0; width:25%; background:rgba(255,93,108,.35);}
  .gbar .dot{position:absolute; top:-3px; width:4px; height:14px; margin-left:-2px; border-radius:2px; background:var(--text);}
  .gnum{font-size:11px; color:var(--sub); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .chip{flex:0 0 auto; font-size:11.5px; font-weight:800; padding:4px 8px; border-radius:8px; white-space:nowrap;
    background:rgba(136,150,179,.16); color:var(--sub);}
  .chip.buy{background:rgba(35,196,131,.22); color:var(--buy);}
  .chip.sell{background:rgba(255,93,108,.22); color:var(--sell);}
  .chip.acc{background:var(--accBg); color:var(--accent);}
  /* 詳細 */
  .back{background:none; border:none; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0; margin-bottom:4px;}
  .dec{border-radius:16px; padding:16px; margin-bottom:12px; border:1px solid var(--neu); background:rgba(136,150,179,.1);}
  .dec.buy{border-color:var(--buy); background:var(--buyBg);}
  .dec.sell{border-color:var(--sell); background:var(--sellBg);}
  .dec .pair{font-size:13px; color:var(--sub);}
  .dec .pair b{color:var(--text); font-size:17px;}
  .dec .head{font-size:23px; font-weight:800; margin:4px 0 2px;}
  .dec.buy .head{color:var(--buy);} .dec.sell .head{color:var(--sell);} .dec .head.neu{color:var(--text);}
  .chk{margin-top:10px; background:rgba(0,0,0,.25); border-radius:10px; padding:8px 10px; font-size:12.5px; line-height:1.7;}
  .chk .ok{color:#8ff0c6;} .chk .ng{color:#ffb3ba; font-weight:700;} .chk .wa{color:var(--accent);}
  .kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .kv:last-child{border-bottom:none;}
  .kv span:first-child{color:var(--sub);}
  .kv b{text-align:right;}
  .steps{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px;}
  .steps h3{font-size:13px; margin:2px 0 6px; color:var(--accent);}
  .steps h4{font-size:12px; color:var(--sub); margin:10px 0 3px; padding-top:8px; border-top:1px dashed var(--line);}
  .steps h4:first-of-type{border-top:none; padding-top:0; margin-top:2px;}
  .st{font-size:12.5px; line-height:1.75; margin:2px 0;}
  .kbd{display:inline-block; padding:0 6px; border:1px solid #3a4763; border-radius:6px; background:#1d2638;
    font-weight:700; line-height:1.5; white-space:nowrap;}
  .val{font-weight:800; color:var(--accent);}
  .slbox{margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--sellBg); color:#ffb3ba; font-size:12.5px; font-weight:600;}
  .exbox{margin:6px 0; padding:8px 10px; border-radius:10px; background:var(--accBg); color:var(--accent); font-size:12.5px; font-weight:600;}
  .field{display:flex; align-items:center; gap:8px; margin:8px 0;}
  .field label{flex:0 0 118px; font-size:12.5px; color:var(--sub);}
  .field input,.field select{flex:1; min-width:0; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:#0c111c; color:var(--text); font-size:16px; font-weight:700;}
  .btn{display:block; width:100%; padding:13px; border-radius:12px; border:1px solid var(--accent); background:var(--accent);
    color:#1a1300; font-weight:800; font-size:15px; margin-top:10px;}
  .btn.ghost{background:transparent; color:var(--accent);}
  .btn.red{background:transparent; color:#ffb3ba; border-color:var(--sell);}
  .btn:active{opacity:.8;}
  .pos{border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:8px; background:var(--card2);}
  .pos.due{border-color:var(--accent); background:var(--accBg);}
  .pos .t{display:flex; justify-content:space-between; gap:8px; font-weight:800;}
  .plus{color:var(--buy);} .minus{color:var(--sell);}
  canvas{width:100%; display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:6px 4px; border-bottom:1px solid var(--line); text-align:right;}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--sub); font-weight:600; font-size:11.5px;}
  details{margin:0;}
  details.card > summary{cursor:pointer; color:var(--accent); font-weight:700; list-style:none; display:flex; justify-content:space-between;}
  details.card > summary::after{content:"＋"; color:var(--sub);}
  details.card[open] > summary::after{content:"－";}
  details.card > summary::-webkit-details-marker{display:none;}
  details.card[open] > summary{margin-bottom:8px;}
  .foot{font-size:11px; color:var(--sub); text-align:center; margin-top:10px; line-height:1.7;}
  .loading{text-align:center; padding:40px 0; color:var(--sub);}
  dl{margin:0; line-height:1.55;}
  dt{color:var(--accent); font-weight:700; margin-top:10px; font-size:13px;}
  dd{margin:2px 0 0; font-size:12.5px;}
  .tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:12px;}
  .tabs button{padding:10px 0; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:13px; font-weight:700;}
  .tabs button.on{background:var(--accent); color:#1a1300; border-color:var(--accent);}
  .ybar{display:flex; align-items:center; gap:6px; font-size:11.5px; margin:3px 0;}
  .ybar .y{flex:0 0 36px; color:var(--sub);}
  .ybar .b{flex:1; position:relative; height:12px;}
  .ybar .b i{position:absolute; top:0; bottom:0; border-radius:3px;}
  .ybar .v{flex:0 0 52px; text-align:right;}
</style>
</head>
<body>
  <div class="top">
    <h1>FX シグナル</h1>
    <div class="upd" id="upd"></div>
    <button class="iconbtn" id="refresh" aria-label="更新">↻</button>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="home" class="on">きょう</button>
    <button data-v="stats">成績</button>
    <button data-v="set">設定・用語</button>
  </div>
  <div id="app"><div class="loading">読み込み中…</div></div>
  <div class="foot">毎朝9時の値で自動判定（GitHub が計算・APIキー不要）<br>※参考情報です。必ず勝てる方法はありません。最終判断は自己責任で。</div>

<script>
"use strict";
// ================= 基本 =================
const PAIRS = ["USDJPY","EURJPY","GBPJPY","AUDJPY","NZDJPY","CADJPY","CHFJPY","EURUSD","GBPUSD","AUDUSD","EURGBP"];
const JP = {USD:"米ドル",JPY:"円",EUR:"ユーロ",GBP:"ポンド",AUD:"豪ドル",NZD:"NZドル",CAD:"カナダドル",CHF:"スイスフラン"};
const MINI = {USDJPY:"USM/JPY",EURJPY:"EUM/JPY",GBPJPY:"GBM/JPY",AUDJPY:"AUM/JPY"};   // DMM のミニ（1Lot＝1,000通貨）
const $ = s => document.querySelector(s);
const app = () => $("#app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = store.get("fx_cache", null), FUND = store.get("fx_fund", null);
let balance = +store.get("fx_bal", 0) || 0;
let riskPct = +store.get("fx_risk", 2) || 2;
let positions = store.get("fx_pos", []);
let view = "home", sel = null, loading = false, lastFetch = 0, pollTimer = null;

const slash = p => p.slice(0,3) + "/" + p.slice(3);
const jpName = p => JP[p.slice(0,3)] + "/" + JP[p.slice(3)];
const pipOf = p => p.endsWith("JPY") ? 0.01 : 0.0001;
const dpOf = p => p.endsWith("JPY") ? 3 : 5;
const fx = (p, v) => v == null ? "—" : (+v).toFixed(dpOf(p));
const yen = v => "¥" + Math.round(v).toLocaleString();
const sgn = v => (v > 0 ? "+" : "") + v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const W = ["日","月","火","水","木","金","土"];
function jd(iso){ if(!iso) return "—"; const [y,m,d] = iso.split("-").map(Number); const w = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return `${m}/${d}(${W[w]})`; }
// 日本時間の「いま」
function nowJ(){ const d = new Date(Date.now() + 9*3600e3);
  return {date:d.toISOString().slice(0,10), h:d.getUTCHours(), m:d.getUTCMinutes(), dow:d.getUTCDay()}; }
function addDaysIso(iso, n){ const [y,m,d] = iso.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }

// 1Lot（1万通貨）で 1pip 動いた時の円
function yenPerPip(p){
  const q = p.slice(3);
  if(q === "JPY") return 100;
  const P = DATA && DATA.pairs;
  if(q === "USD" && P && P.USDJPY) return P.USDJPY.price;
  if(q === "GBP" && P && P.GBPJPY) return P.GBPJPY.price;
  return 150;
}
// 資金とリスク%から Lot 数（ミニがあるペアはミニも見る）
function lotPlan(p, slPips){
  const perLot = slPips * yenPerPip(p);          // 1Lot で損切りまで行った時の損
  if(!(balance > 0)) return {set:false, perLot};
  const cap = balance * riskPct / 100;
  const lots = Math.floor(cap / perLot);
  if(lots >= 1) return {set:true, lots, mini:false, units:lots*10000, loss:lots*perLot, cap, perLot};
  if(MINI[p]){
    const ml = Math.floor(cap / (perLot/10));
    if(ml >= 1) return {set:true, lots:ml, mini:true, units:ml*1000, loss:ml*perLot/10, cap, perLot};
  }
  return {set:true, lots:0, cap, perLot};
}

// ================= データ =================
async function load(force){
  if(loading) return; loading = true; $("#refresh").innerHTML = '<span class="spin">↻</span>';
  try{
    const t = Date.now();
    const [d, f] = await Promise.all([
      fetch("data.json?t=" + t, {cache:"no-store"}).then(r => { if(!r.ok) throw new Error("data " + r.status); return r.json(); }),
      fetch("fundamentals.json?t=" + t, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    DATA = d; if(f) FUND = f; lastFetch = Date.now();
    store.set("fx_cache", DATA); if(f) store.set("fx_fund", FUND);
    render();
  }catch(e){
    if(!DATA) app().innerHTML = `<div class="card"><div class="warn" style="margin:0">データを読み込めませんでした（${esc(e.message)}）。通信を確認して ↻ を押してください。</div></div>`;
    else toastOffline();
  }finally{
    loading = false; $("#refresh").textContent = "↻"; schedulePoll();
  }
}
function toastOffline(){ const u = $("#upd"); if(u) u.innerHTML = '<span style="color:var(--sell)">通信できず前回の値</span>'; }

// 今朝 9 時の判定がまだ届いていない（平日 9 時過ぎ）なら、2 分ごとに取りに行く
function waitingForMorning(){
  if(!DATA) return false;
  const n = nowJ();
  if(n.dow === 0 || n.dow === 6) return false;
  return n.h >= 9 && DATA.latest < n.date;
}
function schedulePoll(){
  clearTimeout(pollTimer);
  if(waitingForMorning()) pollTimer = setTimeout(() => { if(document.visibilityState === "visible") load(); else schedulePoll(); }, 120000);
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && Date.now() - lastFetch > 10*60e3) load();
  else if(document.visibilityState === "visible") render();
});

// ================= 判定（画面で決めるのは「時刻」と「あなたの事情」だけ） =================
// サインそのもの（RSI・損切り幅・手仕舞い日）は build.py が計算済み。ここでは
//   ・今日のサインか／12時を過ぎていないか
//   ・介入警戒（ドル円の買い）・資金・同じペアを保有中か・イベント
// を突き合わせて「入る／見送り／様子見」を1つに決める。
function eventsFor(p, from, days){
  if(!FUND) return [];
  const a = p.slice(0,3), b = p.slice(3), to = addDaysIso(from, days);
  return (FUND.events || []).filter(e => (e.cur === a || e.cur === b) && e.date >= from && e.date <= to);
}
function alertFor(p, price){
  const al = FUND && FUND.pairAlerts && FUND.pairAlerts[p];
  if(!al || price == null) return null;
  if(al.dangerDir === "up" && price >= al.level - al.near) return al;
  if(al.dangerDir === "down" && price <= al.level + al.near) return al;
  return null;
}
function decide(p){
  const pd = DATA.pairs[p], n = nowJ(), rule = DATA.rule;
  const rows = [], ng = [], wa = [];
  const add = (s, t) => { rows.push({s, t}); if(s === "ng") ng.push(t); if(s === "wa") wa.push(t); };
  if(!pd.sig) return {kind:"WAIT", rows:[]};
  const dir = pd.sig, dn = dir === 1 ? "買い" : "売り";
  const today = pd.date === n.date;
  const mine = positions.find(x => x.pair === p);
  if(mine && mine.date === pd.date)
    return {kind:"DONE", dir, dn, rows:[{s:"ok", t:`記録済み：${jd(mine.date)} に ${fx(p, mine.entry)} で入った。手仕舞いは ${jd(mine.exit)} の朝9〜12時`}], ng:[], wa:[], today};
  if(!today) add("ng", `サイン：${jd(pd.date)}のサイン。初日だけ有効（2日目に入ると負け越し）`);
  else if(n.h >= rule.deadline) add("ng", `時刻：${rule.deadline}時を過ぎた（遅れて入ると成績が落ちる。次のサインを待つ）`);
  else add("ok", `サイン：今朝 RSI ${pd.rsiPrev}→${pd.rsi} で${dir === 1 ? rule.buyAt + "以下" : rule.sellAt + "以上"}に入った（初日）`);
  const al = alertFor(p, pd.price);
  if(al && dir === 1) add("ng", "介入警戒：ドル円は介入が入りやすい水準。『買い』は入らない");
  if(positions.some(x => x.pair === p)) add("ng", "保有中：このペアはもう持っている（1ペア1つまで）");
  const lp = lotPlan(p, pd.atrPips * rule.slAtr);
  if(!lp.set) add("wa", "資金：未設定（設定タブで資金を入れると Lot 数と損失額が出る）");
  else if(lp.lots < 1) add("ng", `資金：最小の1Lotでも損切り時の損が${yen(lp.perLot / (MINI[p] ? 10 : 1))}で、上限${yen(lp.cap)}（資金の${riskPct}%）を超える`);
  else add("ok", `資金：${lp.mini ? "ミニ " : ""}${lp.lots}Lot なら損切り時の損は${yen(lp.loss)}（資金の${(lp.loss / balance * 100).toFixed(1)}%）`);
  const ev = eventsFor(p, pd.date, 1);
  if(ev.length) add("wa", `イベント：${ev.map(e => `${jd(e.date)} ${e.time} ${e.name}`).join("、")}。値が飛びやすい（損切りは必ず置く）`);
  const kind = ng.length ? "NO" : "GO";
  return {kind, dir, dn, rows, ng, wa, lp, today};
}

// ================= 描画 =================
function render(){
  if(!DATA) return;
  const n = nowJ();
  const age = `${DATA.updated.slice(5).replace("-", "/")} 更新`;
  $("#upd").innerHTML = age;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === (view === "pair" ? "home" : view)));
  if(view === "pair" && sel) return renderPair(sel);
  if(view === "stats") return renderStats();
  if(view === "set") return renderSettings();
  renderHome();
}

function statusOf(p){
  const pd = DATA.pairs[p], n = nowJ(), r = DATA.rule;
  if(pd.sig && pd.date === n.date){
    if(n.h < r.deadline) return {cls: pd.sig === 1 ? "buy" : "sell", t: (pd.sig === 1 ? "買い" : "売り") + " 12時まで", rank:0};
    return {cls:"", t:"締切（" + (pd.sig === 1 ? "買い" : "売り") + "）", rank:2};
  }
  const act = (pd.active || []).find(a => a.bars < r.hold && !a.stopped);
  if(act) return {cls:"acc", t:`${act.dir === 1 ? "買い" : "売り"}進行中`, rank:3};
  if(pd.rsi <= r.buyAt + 5 && pd.rsi > r.buyAt) return {cls:"acc", t:"買いまで あと少し", rank:1};
  if(pd.rsi >= r.sellAt - 5 && pd.rsi < r.sellAt) return {cls:"acc", t:"売りまで あと少し", rank:1};
  return {cls:"", t:"", rank:4};
}
// 一覧の行に出す「次の朝9時にいくらならサインか」（近い方だけ）
function nearTrig(p){
  const pd = DATA.pairs[p], t = pd.trig;
  const pb = t.buy ? (1 - t.buy / pd.price) * 100 : 1e9, ps = t.sell ? (t.sell / pd.price - 1) * 100 : 1e9;
  if(pb === 1e9 && ps === 1e9) return "";
  return pb <= ps ? `明朝 ${fx(p, t.buy)}以下で買い` : `明朝 ${fx(p, t.sell)}以上で売り`;
}

function heroHtml(){
  const n = nowJ(), r = DATA.rule;
  const weekend = n.dow === 0 || n.dow === 6;
  if(waitingForMorning()){
    return `<div class="hero wait"><div class="k">${jd(n.date)}</div>
      <div class="big">今朝9時の判定を取り込み中…</div>
      <div class="note">毎朝9時の値で自動計算しています（ふだん9時10分〜30分ごろ）。この画面は2分ごとに自動で確かめます。<br>下は前の営業日（${jd(DATA.latest)}）の状態です。</div></div>`;
  }
  const todays = PAIRS.filter(p => DATA.pairs[p].sig && DATA.pairs[p].date === n.date);
  if(todays.length && n.h < r.deadline){
    const left = (r.deadline - n.h - 1) * 60 + (60 - n.m);
    const rows = todays.map(p => {
      const d = decide(p), pd = DATA.pairs[p];
      const ok = d.kind === "GO";
      const msg = d.kind === "DONE" ? "入った（記録済み）" : ok ? "入ってOK" + (d.wa.length ? "（△注意あり）" : "") : "サインは出たが見送り：" + esc(d.ng[0].split("：")[0]);
      return `<div class="go-row" data-p="${p}">
        <div><b style="color:${pd.sig === 1 ? "var(--buy)" : "var(--sell)"}">${slash(p)} ${d.dn}</b>
        <div class="note">${msg}</div></div>
        <div class="arrow">›</div></div>`;
    }).join("");
    const kinds = todays.map(p => decide(p).kind);
    const anyGo = kinds.includes("GO"), allDone = kinds.every(k => k === "DONE" || k === "NO") && kinds.includes("DONE");
    const one = DATA.pairs[todays[0]].sig;
    return `<div class="hero ${anyGo ? (one === 1 ? "go-buy" : "go-sell") : "wait"}">
      <div class="k">${jd(n.date)} 今朝9時の判定</div>
      <div class="big">${anyGo ? "きょう入るペアがあります" : allDone ? "きょうの取引は記録済み" : "サインは出たが、きょうは見送り"}</div>
      <div class="note">入るのは<b>${r.deadline}時まで</b>（あと${Math.floor(left / 60)}時間${left % 60}分）。タップで注文手順へ。</div>${rows}</div>`;
  }
  if(todays.length){
    return `<div class="hero wait"><div class="k">${jd(n.date)}</div><div class="big">きょうのサインは締め切りました</div>
      <div class="note">${todays.map(slash).join("・")} にサインが出ましたが、入るのは${r.deadline}時までです（遅れて入ると成績が落ちると検証で分かっています）。次のサインを待ちましょう。</div></div>`;
  }
  const near = PAIRS.map(p => ({p, s:statusOf(p)})).filter(x => x.s.rank === 1);
  return `<div class="hero wait"><div class="k">${weekend ? "土日は相場が休み" : jd(DATA.latest) + " 9時の判定"}</div>
    <div class="big">${weekend ? "次の判定は月曜の朝9時" : "きょうは入るペアなし"}</div>
    <div class="note">${weekend ? "" : "<b>何もしないのが正解</b>です。サインは11ペア合わせて月に2回ほどしか出ません。"}
    ${near.length ? `<br>サインが近いペア：${near.map(x => `<b>${slash(x.p)}</b>（${x.s.t.replace(" あと少し", "")}）`).join("、")}` : ""}</div></div>`;
}

function positionsHtml(){
  const n = nowJ();
  const mine = positions.map((x, k) => {
    const pd = DATA.pairs[x.pair]; if(!pd) return "";
    const live = pd.live ? pd.live.p : pd.price;
    const units = x.units || 10000;
    const pnl = (live - x.entry) * x.dir * units * (yenPerPip(x.pair) / 100 / pipOf(x.pair) / 100);
    const due = x.exit <= n.date;
    const stopHit = x.dir === 1 ? live <= x.stop : live >= x.stop;
    return `<div class="pos ${due ? "due" : ""}">
      <div class="t"><span>${slash(x.pair)} ${x.dir === 1 ? "買い" : "売り"} ${x.mini ? "ミニ" : ""}${x.lots}Lot</span>
        <span class="${pnl >= 0 ? "plus" : "minus"}">${pnl >= 0 ? "+" : ""}${yen(pnl).replace("¥-", "-¥")}</span></div>
      <div class="note">入った ${jd(x.date)} ${fx(x.pair, x.entry)} ／ 損切り ${fx(x.pair, x.stop)} ／ いま ${fx(x.pair, live)}</div>
      <div class="note" style="color:${due ? "var(--accent)" : "var(--sub)"}"><b style="color:inherit">${due ? "きょうが手仕舞い日" : "手仕舞い " + jd(x.exit) + " 朝9〜12時"}</b>
        ${due ? "：ポジション照会 → 左にスワイプ →『クイック決済』（逆指値は自動で取消）" : ""}
        ${stopHit ? "<br>損切りの値に届いている可能性があります。DMMで確認を。" : ""}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" style="padding:9px; font-size:13px;" data-ics="${k}">カレンダーに入れる</button>
        <button class="btn red" style="padding:9px; font-size:13px;" data-close="${k}">手仕舞った（消す）</button></div>
    </div>`;
  }).join("");
  if(!mine) return "";
  return `<div class="card"><h2>持っている取引 <small>記録した分</small></h2>${mine}
    <div class="note" style="margin-top:6px;">損益はおおよそ（${DATA.updated.slice(11)}ごろの値）。正確な値はDMMアプリで。</div></div>`;
}

function renderHome(){
  const list = PAIRS.map(p => ({p, s:statusOf(p)})).sort((a, b) => a.s.rank - b.s.rank || Math.abs(50 - DATA.pairs[b.p].rsi) - Math.abs(50 - DATA.pairs[a.p].rsi));
  const r = DATA.rule;
  const rows = list.map(({p, s}) => {
    const pd = DATA.pairs[p];
    return `<div class="prow" data-p="${p}">
      <div class="pn">${slash(p)}<small>${fx(p, pd.price)}</small></div>
      <div class="gauge"><div class="gbar"><div class="zb"></div><div class="zs"></div><div class="dot" style="left:${Math.max(1, Math.min(99, pd.rsi))}%"></div></div>
        <div class="gnum">RSI <b style="color:var(--text)">${pd.rsi}</b>　${nearTrig(p)}</div></div>
      ${s.t ? `<div class="chip ${s.cls}">${s.t}</div>` : ""}</div>`;
  }).join("");
  const stale = staleNote();
  app().innerHTML = stale + heroHtml() + positionsHtml() + eventStrip() +
    `<div class="card"><h2>11ペアの状態 <small>${jd(DATA.latest)} 9時の値</small></h2>${rows}
     <div class="note" style="margin-top:8px;">RSI（行きすぎ度 0〜100）が<b>${r.buyAt}以下に入った日に買い</b>、<b>${r.sellAt}以上に入った日に売り</b>。緑・赤の帯に入った<b>初日だけ</b>がサインです。タップで詳しく。</div></div>`;
  bindHome();
}
function staleNote(){
  // 平日なのに 2 日以上前の値しか無い＝自動更新が止まっている
  const n = nowJ();
  const lag = (Date.parse(n.date) - Date.parse(DATA.latest)) / 86400e3;
  const limit = n.dow === 1 ? 3 : (n.dow === 0 ? 2 : 1);
  if(lag > limit && !(n.dow === 6 && lag <= 1)) return `<div class="warn">⚠ データが${jd(DATA.latest)}のまま更新されていません。自動更新が止まっている可能性があります。</div>`;
  return "";
}
function eventStrip(){
  if(!FUND) return "";
  const n = nowJ();
  const ev = (FUND.events || []).filter(e => e.date >= n.date && e.date <= addDaysIso(n.date, 6));
  if(!ev.length) return "";
  const urgent = ev.some(e => e.date <= addDaysIso(n.date, 1));
  return `<details class="card" ${urgent ? "open" : ""}><summary>📅 この1週間の重要発表（${ev.length}件）</summary>
    ${ev.map(e => `<div class="kv"><span>${jd(e.date)} ${e.time}</span><b>${esc(e.name)}</b></div>`).join("")}
    <div class="note" style="margin-top:6px;">発表の前後は値が飛びやすい。サインの判定には使っていません（検証していないため）。</div></details>`;
}
function bindHome(){
  app().querySelectorAll("[data-p]").forEach(el => el.addEventListener("click", () => openPair(el.dataset.p)));
  app().querySelectorAll("[data-close]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    const k = +el.dataset.close;
    if(confirm(`${slash(positions[k].pair)} の記録を消しますか？（DMMで決済したあとに押す）`)){ positions.splice(k, 1); store.set("fx_pos", positions); render(); }
  }));
  app().querySelectorAll("[data-ics]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); downloadIcs(positions[+el.dataset.ics]); }));
}
function openPair(p){ sel = p; view = "pair"; render(); window.scrollTo(0, 0); }

// ---------- ペア詳細 ----------
function renderPair(p){
  const pd = DATA.pairs[p], r = DATA.rule, n = nowJ();
  const d = decide(p);
  const dir = pd.sig || (pd.rsi < 50 ? 1 : -1);        // サインが無い時は「もし入るなら」の参考方向
  const cls = d.kind === "GO" || d.kind === "DONE" ? (d.dir === 1 ? "buy" : "sell") : "";
  const head = d.kind === "GO" ? `${d.dn}で入ってOK` : d.kind === "DONE" ? `${d.dn}で入りました` : (d.kind === "NO" ? `${d.dn}サインだが見送り` : "様子見（何もしない）");
  const sub = d.kind === "GO" ? `${r.deadline}時までに入る` + (d.wa.length ? "・△を読んでから" : "")
            : d.kind === "DONE" ? "あとは損切り（逆指値）を置いて、手仕舞いの日を待つだけ"
            : d.kind === "NO" ? "理由：" + d.ng.map(t => t.split("：")[0]).join("・")
            : `いまの RSI ${pd.rsi}。${r.buyAt}以下か${r.sellAt}以上に入った初日だけがサイン`;
  const mark = {ok:"✔", ng:"✖", wa:"△"};
  const chk = d.rows && d.rows.length ? `<div class="chk">${d.rows.map(x => `<div class="${x.s}">${mark[x.s]} ${esc(x.t)}</div>`).join("")}</div>` : "";
  const al = alertFor(p, pd.price);
  let html = `<button class="back" id="back">‹ 一覧へ</button>
    <div class="dec ${cls}">
      <div class="pair"><b>${slash(p)}</b>　${jpName(p)}　今朝9時 <b>${fx(p, pd.price)}</b></div>
      <div class="head ${cls ? "" : "neu"}">${head}</div>
      <div class="note">${sub}</div>${chk}
    </div>`;
  if(al) html += `<div class="warn">⚠ ${esc(al.note)}</div>`;
  if(d.kind === "GO") html += orderCard(p, pd.sig, true);
  html += triggerCard(p);
  html += activeCard(p);
  if(d.kind !== "GO") html += `<details class="card"><summary>${d.kind === "DONE" ? "注文手順（損切り・手仕舞いの確認）" : d.kind === "NO" ? "参考：それでも入るなら（注文手順）" : "参考：注文のしかた（サインが出た時用）"}</summary>${orderCard(p, dir, false)}</details>`;
  html += `<div class="card"><h2>チャート <small>毎朝9時の値・90日</small></h2><canvas id="cv" height="260"></canvas>
    <div class="note">上：値段　下：RSI（緑の帯＝${r.buyAt}以下、赤の帯＝${r.sellAt}以上）。▲▼＝過去のサイン</div></div>`;
  html += pairStatsCard(p);
  html += refCard(p);
  html += fundCard(p);
  app().innerHTML = html;
  $("#back").onclick = () => { view = "home"; render(); };
  bindOrder(p);
  drawChart(p);
}

function orderCard(p, dir, primary){
  const pd = DATA.pairs[p], r = DATA.rule;
  const dn = dir === 1 ? "買い" : "売り", btn = dir === 1 ? "Ask(買)" : "Bid(売)";
  const slPips = pd.atrPips * r.slAtr;
  const lp = lotPlan(p, slPips);
  const exit = pd.exit || nextExit(pd.date);
  const sym = lp.mini ? MINI[p] : slash(p);
  const lots = lp.set && lp.lots >= 1 ? lp.lots : 1;
  const K = t => `<span class="kbd">${t}</span>`;
  const id = primary ? "o1" : "o2";
  return `<div class="${primary ? "card" : ""}" id="${id}" data-dir="${dir}">
    ${primary ? `<h2>DMM FX アプリでの注文 <small>画面の順番どおり</small></h2>` : ""}
    <div class="field"><label>約定したレート</label><input class="fill" inputmode="decimal" value="${fx(p, pd.live ? pd.live.p : pd.price)}"></div>
    <div class="note">入ったあと、DMMの「ポジション照会」に出る<b>約定レート</b>に直すと、下の損切りの値が合います。</div>
    <div class="slbox">損切り（逆指値）レート <span class="slv" style="font-size:16px">—</span><br>
      <span style="font-weight:400">＝約定レートから ${slPips.toFixed(0)}pips（ATR×${r.slAtr}）${dir === 1 ? "下" : "上"}</span></div>
    ${lp.set ? (lp.lots >= 1 ? `<div class="note">数量：<b>${lp.mini ? sym + "（ミニ）で " : ""}${lp.lots} Lot</b>（${lp.units.toLocaleString()}通貨）→ 損切りに届いた時の損 <b class="minus">約${yen(lp.loss)}</b>（資金の${(lp.loss / balance * 100).toFixed(1)}%）</div>`
      : `<div class="warn" style="margin:8px 0 0">資金${yen(balance)}・リスク${riskPct}%では、最小の1Lotでも損切り時の損（約${yen(lp.perLot / (MINI[p] ? 10 : 1))}）が上限${yen(lp.cap)}を超えます。資金を増やすかリスク%を上げない限り、見送りが安全です。</div>`)
      : `<div class="note">1Lot（1万通貨）で損切りに届いた時の損は <b class="minus">約${yen(lp.perLot)}</b>。設定タブで資金を入れると、あなたに合った Lot 数を出します。</div>`}
    <div class="steps">
      <h3>STEP1　いま「${dn}」で入る（新規・即時）</h3>
      <div class="st">① ${K("トレード")} → 通貨ペア <b>${sym}</b> → ${K(btn)}</div>
      <div class="st">② 注文タイプ ${K("即時")}／売買 <span class="val">${dir === 1 ? "買" : "売"}</span>／注文数量 <span class="val">${lots} Lot</span></div>
      <div class="st">③ ${K("損切")} は <span class="val">OFF</span>（STEP2 で正確な値を入れる）→ ${K("確認画面")} → ${K("注文")}</div>
      <h4>STEP2　損切りを予約する（決済・逆指値）</h4>
      <div class="st">④ ${K("ポジション照会")} → いま入ったポジションをタップ</div>
      <div class="st">⑤ 注文タイプ ${K("指値・逆指値")}／注文数量 <span class="val">${lots} Lot</span>／執行条件 ${K("逆指値")}</div>
      <div class="st">⑥ 注文レートに <span class="val slv">—</span>／有効期限 ${K("無期限")} → ${K("確認画面")} → ${K("注文")}</div>
      <div class="st">利確（指値）は<b>置きません</b>。検証では5日で手仕舞う方が良かったため。</div>
      <h4>STEP3　${jd(exit)} の朝9〜12時に手仕舞う</h4>
      <div class="st">⑦ ${K("ポジション照会")} → ポジションを<b>左にスワイプ</b> → ${K("クイック決済")} → ${K("クイック決済")}</div>
      <div class="st">付けておいた逆指値は自動で取り消されます。その前に損切りに届いていたら、もう何もしなくてOK。</div>
    </div>
    ${primary ? `<button class="btn rec">入った！この内容で記録する</button>
      <div class="note" style="margin-top:6px;">記録すると、きょうの画面に手仕舞い日と損益の目安が出ます（この端末の中だけに保存）。</div>` : ""}
  </div>`;
}
function nextExit(iso){ let d = iso, k = 0; while(k < DATA.rule.hold){ d = addDaysIso(d, 1); const w = new Date(d + "T00:00:00Z").getUTCDay(); if(w !== 0 && w !== 6 && !/-12-25$|-01-01$/.test(d)) k++; } return d; }
function bindOrder(p){
  const pd = DATA.pairs[p], r = DATA.rule;
  ["o1", "o2"].forEach(id => {
    const box = document.getElementById(id); if(!box) return;
    const dir = +box.dataset.dir, inp = box.querySelector(".fill");
    const upd = () => {
      const f = parseFloat(String(inp.value).replace(/[^\d.]/g, ""));
      const v = f > 0 ? fx(p, f - dir * r.slAtr * pd.atr) : "—";
      box.querySelectorAll(".slv").forEach(x => x.textContent = v);
    };
    inp.addEventListener("input", upd); upd();
    const rec = box.querySelector(".rec");
    if(rec) rec.addEventListener("click", () => {
      const f = parseFloat(String(inp.value).replace(/[^\d.]/g, ""));
      if(!(f > 0)){ alert("約定したレートを入れてください"); return; }
      const lp = lotPlan(p, pd.atrPips * r.slAtr);
      const lots = lp.set && lp.lots >= 1 ? lp.lots : 1;
      positions = positions.filter(x => x.pair !== p);
      positions.push({pair:p, dir, entry:f, stop:+(f - dir * r.slAtr * pd.atr).toFixed(dpOf(p)), lots, mini:!!lp.mini,
        units: lp.mini ? lots * 1000 : lots * 10000, date:pd.date, exit:pd.exit || nextExit(pd.date)});
      store.set("fx_pos", positions);
      view = "home"; render(); window.scrollTo(0, 0);
    });
  });
}
function triggerCard(p){
  const pd = DATA.pairs[p], r = DATA.rule;
  const b = pd.trig.buy, s = pd.trig.sell;
  const pct = v => ((v / pd.price - 1) * 100).toFixed(1);
  return `<div class="card"><h2>次の朝9時のサイン価格 <small>${jd(addWeekday(pd.date))} 9時</small></h2>
    ${b ? `<div class="kv"><span>この値<b>以下</b>なら 買いサイン</span><b class="plus">${fx(p, b)}（${pct(b)}%）</b></div>` : `<div class="kv"><span>買いサイン</span><b>いま RSI が${r.buyAt}以下のため、明日は出ない</b></div>`}
    ${s ? `<div class="kv"><span>この値<b>以上</b>なら 売りサイン</span><b class="minus">${fx(p, s)}（+${pct(s)}%）</b></div>` : `<div class="kv"><span>売りサイン</span><b>いま RSI が${r.sellAt}以上のため、明日は出ない</b></div>`}
    <div class="note" style="margin-top:6px;">DMMアプリの<b>レート通知</b>にこの値を入れておくと、サインが近づいた時に気づけます（判定はあくまで朝9時の値）。</div></div>`;
}
function addWeekday(iso){ let d = addDaysIso(iso, 1); while([0, 6].includes(new Date(d + "T00:00:00Z").getUTCDay())) d = addDaysIso(d, 1); return d; }
function activeCard(p){
  const pd = DATA.pairs[p], r = DATA.rule, n = nowJ();
  const act = (pd.active || []).filter(a => a.bars > 0 || a.date !== n.date);
  if(!act.length) return "";
  return `<div class="card"><h2>このペアで最近出たサイン <small>手仕舞い前</small></h2>
    ${act.map(a => `<div class="kv"><span>${jd(a.date)} ${a.dir === 1 ? "買い" : "売り"} ${fx(p, a.entry)}</span>
      <b>${a.stopped ? '<span class="minus">損切りに届いた</span>' : (a.exit <= n.date ? "きょう手仕舞い" : jd(a.exit) + " 手仕舞い")}</b></div>`).join("")}
    <div class="note" style="margin-top:6px;">その日に入った場合の予定です（損切り ${act.map(a => fx(p, a.stop)).join("・")}）。</div></div>`;
}
function pairStatsCard(p){
  const pd = DATA.pairs[p], st = pd.stats, all = DATA.stats.all;
  const last = (pd.last || []).map(t => `<tr><td>${t.d.slice(2).replace(/-/g, "/")}</td><td>${t.dir === 1 ? "買い" : "売り"}</td>
    <td>${t.how === "sl" ? "損切り" : "5日後"}</td><td class="${t.ret >= 0 ? "plus" : "minus"}">${sgn(t.ret.toFixed(2))}%</td></tr>`).join("");
  return `<details class="card"><summary>このペアの過去のサイン</summary>
    ${st ? `<div class="note">${DATA.stats.from}年から ${st.n}回・勝率${st.wr}%・1回平均${sgn(st.exp)}%・PF${st.pf ?? "—"}</div>` : ""}
    <div class="note">※1ペアだけだと回数が少なく偶然で上下します（過去に負け越したペアが後で勝つ例も多かった）。判断には<b>11ペア合算の成績</b>（${all.n}回・PF${all.pf}）を使います。</div>
    <table style="margin-top:6px;"><tr><th>入った日</th><th>向き</th><th>終わり方</th><th>損益</th></tr>${last}</table></details>`;
}
function refCard(p){
  const pd = DATA.pairs[p], f = pd.ref;
  const tf = (x, nm) => x ? `<div class="kv"><span>${nm}の RSI</span><b>${x.rsi}（${x.up ? "短期は上向き" : "短期は下向き"}）</b></div>` : "";
  return `<details class="card"><summary>参考：ほかの指標・短い時間足</summary>

    <div class="kv"><span>MACD</span><b>${f.macd === 1 ? "上向き" : "下向き"}</b></div>

    <div class="kv"><span>1日の平均的な値幅（ATR）</span><b>${pd.atrPips}pips</b></div></details>`;
}

// ---------- チャート ----------
function drawChart(p){
  const cv = $("#cv"); if(!cv) return;
  const pd = DATA.pairs[p], r = DATA.rule, ch = pd.chart;
  const dpr = window.devicePixelRatio || 1, Wd = cv.clientWidth, Ht = 260;
  cv.width = Wd * dpr; cv.height = Ht * dpr; cv.style.height = Ht + "px";
  const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const N = ch.c.length, L = 6, R = 52, T1 = 8, B1 = 150, T2 = 168, B2 = 250;
  const x = i => L + (Wd - L - R) * i / (N - 1);
  const lo = Math.min(...ch.c), hi = Math.max(...ch.c), pad = (hi - lo) * 0.08 || 0.01;
  const y1 = v => T1 + (B1 - T1) * (1 - (v - lo + pad) / (hi - lo + 2 * pad));
  const y2 = v => T2 + (B2 - T2) * (1 - v / 100);
  g.font = "11px sans-serif"; g.fillStyle = "#9aa7c2"; g.textAlign = "left";
  // 値段
  g.strokeStyle = "#2a3550"; g.lineWidth = 1;
  [lo, (lo + hi) / 2, hi].forEach(v => { g.beginPath(); g.moveTo(L, y1(v)); g.lineTo(Wd - R, y1(v)); g.stroke(); g.fillText(fx(p, v), Wd - R + 4, y1(v) + 4); });
  g.strokeStyle = "#5b8cff"; g.lineWidth = 2; g.beginPath();
  ch.c.forEach((v, i) => i ? g.lineTo(x(i), y1(v)) : g.moveTo(x(i), y1(v))); g.stroke();
  // RSI
  g.fillStyle = "rgba(35,196,131,.18)"; g.fillRect(L, y2(r.buyAt), Wd - L - R, y2(0) - y2(r.buyAt));
  g.fillStyle = "rgba(255,93,108,.18)"; g.fillRect(L, y2(100), Wd - L - R, y2(r.sellAt) - y2(100));
  g.fillStyle = "#9aa7c2"; [r.buyAt, 50, r.sellAt].forEach(v => g.fillText(String(v), Wd - R + 4, y2(v) + 4));
  g.strokeStyle = "#ffcf4a"; g.lineWidth = 2; g.beginPath();
  ch.r.forEach((v, i) => i ? g.lineTo(x(i), y2(v)) : g.moveTo(x(i), y2(v))); g.stroke();
  // 過去のサイン
  for(let i = 1; i < N; i++){
    const a = ch.r[i - 1], b = ch.r[i];
    const s = (b <= r.buyAt && a > r.buyAt) ? 1 : ((b >= r.sellAt && a < r.sellAt) ? -1 : 0);
    if(!s) continue;
    g.fillStyle = s === 1 ? "#23c483" : "#ff5d6c"; g.beginPath();
    const yy = y1(ch.c[i]) + (s === 1 ? 12 : -12);
    g.moveTo(x(i), yy - 6 * s); g.lineTo(x(i) - 6, yy + 5 * s); g.lineTo(x(i) + 6, yy + 5 * s); g.fill();
  }
  g.fillStyle = "#9aa7c2"; g.textAlign = "left"; g.fillText(jd(ch.d[0]), L, Ht - 2);
  g.textAlign = "right"; g.fillText(jd(ch.d[N - 1]), Wd - R, Ht - 2);
}

// ---------- 成績 ----------
function renderStats(){
  const S = DATA.stats, r = DATA.rule, a = S.all;
  const maxAbs = Math.max(...S.years.map(y => Math.abs(y.sum)), 1);
  const years = S.years.map(y => {
    const w = Math.abs(y.sum) / maxAbs * 50;
    return `<div class="ybar"><span class="y">${y.y}</span><span class="b"><i style="${y.sum >= 0 ? `left:50%;width:${w}%;background:var(--buy)` : `right:50%;width:${w}%;background:var(--sell)`}"></i></span>
      <span class="v ${y.sum >= 0 ? "plus" : "minus"}">${sgn(y.sum)}%</span></div>`;
  }).join("");
  const neg = S.years.filter(y => y.sum < 0).length;
  const eras = S.eras.map(e => `<tr><td>${e.name}</td><td>${e.n}</td><td>${e.wr}%</td><td>${sgn(e.exp)}%</td><td>${e.pf}</td></tr>`).join("");
  const rec = DATA.recent.map(t => `<tr><td>${t.d.slice(2).replace(/-/g, "/")}</td><td>${slash(t.p)}</td><td>${t.dir === 1 ? "買い" : "売り"}</td>
    <td class="${t.ret >= 0 ? "plus" : "minus"}">${sgn(t.ret.toFixed(2))}%</td></tr>`).join("");
  app().innerHTML = `
    <div class="card"><h2>この規則の成績 <small>${S.from}年〜・11ペア合算・スプレッド込み</small></h2>
      <div class="kv"><span>回数</span><b>${a.n}回（月に約${(a.n / ((Date.now() / 3.156e10 + 1970) - S.from) / 12).toFixed(1)}回）</b></div>
      <div class="kv"><span>勝率</span><b>${a.wr}%</b></div>
      <div class="kv"><span>1回の平均損益</span><b class="plus">${sgn(a.exp)}%</b></div>
      <div class="kv"><span>勝った時の平均／負けた時の平均</span><b>${sgn(a.avgWin)}% ／ ${a.avgLoss}%</b></div>
      <div class="kv"><span>PF（総利益÷総損失）</span><b>${a.pf}</b></div>
      <div class="kv"><span>損切りに届いた割合</span><b>${a.sl}%</b></div>
      <div class="kv"><span>直近1年</span><b>${S.year1 ? `${S.year1.n}回・勝率${S.year1.wr}%・PF${S.year1.pf ?? "—"}` : "—"}</b></div>
      <div class="note" style="margin-top:8px;">%は入った値に対する損益。資金に対する損益はリスク%で決まります（リスク2%なら、損切り1回で資金の−2%）。</div></div>
    <div class="card"><h2>時代ごと <small>どの時代でも勝ち越したか</small></h2>
      <table><tr><th>期間</th><th>回数</th><th>勝率</th><th>平均</th><th>PF</th></tr>${eras}</table>
      <div class="note" style="margin-top:6px;">規則は2004〜2018年だけで選び、2019年以降は<b>選ぶのに使っていない</b>期間です。そこでも勝ち越したので、偶然の当てはめではないと判断しました。</div></div>
    <div class="card"><h2>年ごとの合計 <small>負けた年 ${neg}/${S.years.length}</small></h2>${years}
      <div class="note" style="margin-top:6px;">1回ごとの%を足したもの。負ける年もあります。1年単位の結果で規則を変えないのが大事です。</div></div>
    <div class="card"><h2>最近のサインと結果 <small>全ペア</small></h2>
      <table><tr><th>入った日</th><th>ペア</th><th>向き</th><th>損益</th></tr>${rec}</table></div>
    <details class="card"><summary>2026年9月に判定の方法を変えた理由</summary>
      <div class="note" style="color:var(--text)">
      以前の判定（RSI・ボリンジャー・移動平均・MACDの点数）を2004年からの22年分で測り直したところ、<b>勝っていたのは直近5年だけ</b>で、22年通算ではほぼトントン（PF1.03）でした。
      また、Yahoo の日足の「終値」は実は<b>毎朝9時の値</b>だったのに、夕方の終値として計算していたため、成績が実際より良く見えていました。<br><br>
      そこで、日足を「毎朝9時締め」に並べ直し、よく知られた売買規則の型を並べて、<b>2004〜2018年だけで選び、2019年以降で確かめる</b>方法で選び直しました。
      残ったのが今の規則（RSIが${r.buyAt}/${r.sellAt}を越えた初日に入り、損切りATR×${r.slAtr}・${r.hold}日で手仕舞い）です。周りの設定（しきい値20〜30、損切り2〜4、期限3〜7日）もほぼすべて勝ち越しで、1点だけの当たりではありません。<br><br>
      ・9時に判定→<b>12時までに入れば</b>成績は変わらず、18時以降に入ると悪化（1時間足で確認）<br>
      ・サイン2日目に入ると負け越し → 初日だけ<br>
      ・ペアごとの過去成績は次の期間を当てられなかった → ペア別の見送りはしない<br>
      ・APIキー無し版で使っていた ECB のレートは時刻がずれるため使わず、Yahoo の値をサーバーで計算する形に変更
      </div></details>`;
}

function renderSettings(){
  app().innerHTML = `
    <div class="card"><h2>資金とリスク</h2>

      <div class="note">損切りに届いた時の損がこの割合に収まる Lot 数を計算します。<b>2%以下</b>が一般的です。<br>
        この規則の損切りは広め（1日の値幅の3倍）なので、1Lot（1万通貨）で数万円になることがあります。米ドル・ユーロ・ポンド・豪ドルの対円は<b>ミニ（1Lot＝1,000通貨）</b>でも計算します。</div>
      <div class="note" style="margin-top:6px;">この端末の中だけに保存されます。</div></div>
    <details class="card" open><summary>📖 使い方（3ステップ）</summary><div class="note" style="color:var(--text)">

      <b>② DMMアプリで入って、損切り（逆指値）を置く</b><br>約定したレートを入れると、損切りの値が出ます。「記録する」を押しておく。<br><br>
      <b>③ 5営業日後（翌週の同じ曜日）の朝に手仕舞う</b><br>ポジションを左にスワイプ →「クイック決済」。それより前に損切りに届いたら何もしない。<br><br>
      サインは11ペア合わせて月に2回ほど。<b>何もしない日がほとんど</b>で、それが正解です。</div></details>
    <details class="card"><summary>📖 用語</summary><dl>
      <dt>RSI（行きすぎ度）</dt><dd>最近14日の値上がりと値下がりの割合を0〜100にしたもの。25以下＝売られすぎ、75以上＝買われすぎ。この規則はここだけで判定します。</dd>

// ---------- カレンダー（手仕舞い日の通知） ----------
function downloadIcs(x){
  const d = x.exit.replace(/-/g, "");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const title = `FX手仕舞い ${slash(x.pair)} ${x.dir === 1 ? "買い" : "売り"}`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//fx-signal//JA", "BEGIN:VEVENT",
    `UID:${x.pair}-${x.date}@fx-signal`, `DTSTAMP:${stamp}`, `DTSTART:${d}T000000Z`, `DTEND:${d}T030000Z`,
    `SUMMARY:${title}`, "DESCRIPTION:DMM ポジション照会 → 左にスワイプ → クイック決済（9〜12時）",
    "BEGIN:VALARM", "TRIGGER:PT0M", "ACTION:DISPLAY", `DESCRIPTION:${title}`, "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = `fx-${x.pair}-${x.exit}.ics`; document.body.appendChild(a); a.click(); a.remove();
}
