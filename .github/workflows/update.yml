name: update-signals

# 1時間ごとに最新の値でサインを計算して data.json を作る（判定の時刻は固定しない）。
# data.json は main ではなく「data」枝に毎回上書き（force push）する。
# main に毎時コミットするとリポジトリの履歴が膨らみ続けるため。
# 画面は https://raw.githubusercontent.com/hybs02/fx/data/data.json を読む。
on:
  schedule:
    - cron: "23 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: サインを計算して data.json を作る
        run: python build.py

      - name: data 枝に上書きする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data-new
          git rm -rq --cached .
          git add -f data.json
          git commit -qm "データ $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push -fq origin data-new:data
