name: update-signals

# 20分ごとに最新のドル円の値でサインを計算して data.json を作る（判定の時刻は固定しない）。
# GitHub の定時実行は混んでいると遅れたり飛ばされたりする（1時間に3回頼んでも、実際に動くのは数時間おきのことが多い）。
# 頼む回数を減らすともっと間があくので、1時間に3回のままにしておく。
# data.json は main ではなく「data」枝に毎回上書き（force push）する。
# main に毎時コミットするとリポジトリの履歴が膨らみ続けるため。
# 画面は https://raw.githubusercontent.com/hybs02/fx/data/data.json を読む。
on:
  schedule:
    - cron: "3,23,43 * * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-signals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 値が取れなかった時は build.py が止まり、data 枝の前回の結果がそのまま残る
      - name: サインを計算して data.json を作る
        run: python build.py

      - name: data 枝に上書きする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data-new
          git rm -rq --cached .
          git add -f data.json
          git commit -q --allow-empty-message -m ""
          git push -fq origin data-new:data
